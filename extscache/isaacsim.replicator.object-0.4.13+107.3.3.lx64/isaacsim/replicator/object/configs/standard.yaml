isaacsim.replicator.object:
  parent_config: global
  default_camera:
    camera_parameters: $[/camera_parameters]
    transform_operators:
    - rotateY:
        distribution_type: range
        start: -180
        end: 180
    - rotateX: -30
    - translate:
        distribution_type: range
        start:
        - 0
        - 0
        - 600
        end:
        - 0
        - 0
        - 800
    type: camera
  dome_light:
    intensity:
      distribution_type: range
      start: 500
      end: 3000
    subtype: dome
    texture_path:
      distribution_type: set
      values: $[/skies]
    transform_operators:
    - rotateX: 270
    type: light
  placeholder:
    type: geometry
    subtype: cube
    transform_operators:
    - translate:
      - 999999
      - 0
      - 0
    - scale:
      - 0.001
      - 0.001
      - 0.001
  version: 0.4.12
