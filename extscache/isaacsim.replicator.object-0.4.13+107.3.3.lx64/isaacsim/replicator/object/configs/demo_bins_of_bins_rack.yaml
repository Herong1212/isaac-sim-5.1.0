isaacsim.replicator.object:
  version: 0.4.12
  parent_config: standard
  num_frames: 1
  seed: 20
  gravity: 10000
  bin_pack_global_H: # 1 big bin
    harmonizer_type: bin_pack
    bin_size:
    - 3000
    - 200
    - 3000
  bins: # dim of 8 small bins
    count: 8
    dimension:
    - 570
    - 200
    - 315
  transform_global: # transforms of 8 small bins
    count: 8
    distribution_type: harmonized
    harmonizer_name: bin_pack_global_H
    pitch:
    - - -$[/bins_$[index]/dimension~0] / 2 * 2
      - -$[/bins_$[index]/dimension~1] / 2
      - -$[/bins_$[index]/dimension~2] / 2 * 2
    - - $[/bins_$[index]/dimension~0] / 2 * 2
      - $[/bins_$[index]/dimension~1] / 2
      - $[/bins_$[index]/dimension~2] / 2 * 2
  bin_pack_H: # 8 small bins
    count: 8
    harmonizer_type: bin_pack
    bin_size: $[/bins_$[index]/dimension]
  per_group_count: 50
  selected_path:
    count: 50
    distribution_type: folder
    suffix: usd
    value: $[/path_to_boxes]
  mesh:
    count: 400
    physics: rigidbody
    subtype: mesh
    tracked: true
    group_num: $[index]//$[/per_group_count]
    transform_operators:
    - translate:
      - 400
      - 0
      - 400
    - transform_global: $[/transform_global_$[../group_num]]
    - transform:
        distribution_type: harmonized
        harmonizer_name: bin_pack_H_$[../group_num]
        pitch: local_aabb
    - scale:
      - 1
      - 1
      - 1
    type: geometry
    usd_path: $[/selected_path_$[group_num]]
  rack:
    count: 8
    physics: collision
    subtype: mesh
    tracked: false
    transform_operators:
    - translate_global:
      - 400
      - 0
      - 400
    - transform: $[/transform_global_$[../index]]
    - translate:
      - 0
      - -400
      - 0
    - rotateY: 90
    - rotateXYZ:
      - 0
      - -90
      - -90
    - scale:
      - 4
      - 4
      - 4
    type: geometry
    usd_path: $[/server_root]/Assets/DigitalTwin/Assets/Warehouse/Shelving/Racks/Rack_L/Rack_L02_PR_NVD_01.usd
  default_camera:
    camera_parameters: $[/camera_parameters]
    transform_operators:
    - rotateY:
        distribution_type: range
        start: -180
        end: 180
    - rotateX: -30
    - translate:
        distribution_type: range
        start:
        - 0
        - 0
        - 1800
        end:
        - 0
        - 0
        - 2000
    type: camera
