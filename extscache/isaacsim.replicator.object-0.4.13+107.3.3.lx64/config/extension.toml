[package]
# Semantic Versioning is used: https://semver.org/

version = "0.4.13"
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "Object SDG"
description="Object Simulation and Synthetic Data Generation"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Synthetic Data Generation"

# Keywords for the extension
keywords = ["kit", "object", "synthetic data", "object sim", "object detection", "SDG"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

# pip prebundle makes this extension os specific
writeTarget.platform = true
writeTarget.kit = true

# Use omni.ui to build simple UI
[dependencies]
"omni.kit.uiapp" = {}
"omni.replicator.core" = {}
"omni.physx" = {}
"omni.usd.core" = {}
"omni.kit.renderer.core" = {}
"omni.kit.viewport.window" = {}
"omni.timeline" = {}
"omni.pip.compute" = {}
"omni.kit.pip_archive" = {}
"omni.kit.capture.viewport" = {}
"omni.kit.property.usd" = {}
"omni.metropolis.utils" = { version = "^0.1.1"}

"omni.kit.scripting" = {}
"isaacsim.core.utils" = {}
"omni.kit.mesh.raycast" = {}
"isaacsim.util.debug_draw" = {}

# Main python module this extension provides, it will be publicly available as "import isaacsim.replicator.object".
[[python.module]]
name = "isaacsim.replicator.object"

[[python.module]]
name = "regex"
path = "pip_prebundle"

[[python.module]]
name = "trimesh"
path = "pip_prebundle"

[[python.module]]
path = "pip_prebundle"

[[test]]
dependencies = []
args = [
    "--no-window",
    "--/windowless=1",
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
    "--/app/file/ignoreUnsavedStage=1",
]
stdoutFailPatterns.exclude = [
    "*GLInteropContext::init: carb::windowing is not available*"
]

[[test]]
name = "startup"
args = [
    "--/app/settings/fabricDefaultStageFrameHistoryCount=3",
]
stdoutFailPatterns.exclude = [
    "*GLInteropContext::init: carb::windowing is not available*"
]
