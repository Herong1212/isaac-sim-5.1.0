[package]
title = "Physics Umbrella"
description="Handles multiple physics engines."
repository = ""
keywords = ["physics"]
category = "simulation"

version = "107.3.26"
authors = ["NVIDIA"]

icon = "data/icon.png"
preview_image = "data/preview.png"
changelog="docs/CHANGELOG.md"
readme  = "docs/README.md"
support_level = "Core"

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]

[[python.module]]
name = "omni.physics.core"

[[native.plugin]]
path = "bin/*.plugin"

[[test]]
stdoutFailPatterns.exclude = [
    "*Ignore this error/warning*",
]
