[package]
# Semantic Versioning is used: https://semver.org/
version = "0.1.6"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "VSCode Kit Debugger"
description = "VSCode python debugger support window."

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Development Tools"

# Keywords for the extension
keywords = ["kit", "debug", "VSCode"]
support_level = "Core"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

[dependencies]
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.debug.python" = {}
"omni.kit.menu.utils" = {}

[settings]
exts."omni.kit.debug.vscode".visible_at_startup = true

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/USAGE_PYTHON.md"]

[[python.module]]
name = "omni.kit.debug.vscode_debugger"

[[test]]
name="startup"
stdoutFailPatterns.exclude = [
    "*Debugger warning: It seems that frozen modules are being used*",
    "*make the debugger miss breakpoints. Please pass*",
    "*to python to disable frozen modules*",
    "*Note: Debugging will proceed*",
]

[[test]]
pyCoverageEnabled = false
waiver = "Ultrasmall UI on top of omni.kit.debug.python." # OM-48108

# Python-3.11 errors, can also be disabled with env['PYDEVD_DISABLE_FILE_VALIDATION']=1
stdoutFailPatterns.exclude = [
    "*Debugger warning: It seems that frozen modules are being used*",
    "*make the debugger miss breakpoints. Please pass*",
    "*to python to disable frozen modules*",
    "*Note: Debugging will proceed*",
]
