[package]
# Semantic Versioning is used: https://semver.org/
version = "107.1.3"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport Widget"
description="Widget for displaying a render of a Usd Stage"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "viewport", "hydra", "rtx", "render"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Rendering"
support_level = "Core"

[dependencies]
"omni.activity.core" = {optional=true}
"omni.ui" = {}
"omni.kit.hydra_texture" = {}
"omni.kit.commands" = { optional = true }
"omni.kit.viewport.scene_camera_model" = { optional = true }

# Main python module this extension provides, it will be publicly available as "import omni.kit.widget.viewport".
[[python.module]]
name = "omni.kit.widget.viewport"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/Settings.md",
    "docs/CHANGELOG.md",
]

[settings]
# Minimum amount of frames to wait before pushing ui size changes to render texture
exts."omni.kit.widget.viewport".resize.textureFrameDelay = 3
# Push ui size changes to render texture after mouse has stopped moving for this many frames
exts."omni.kit.widget.viewport".resize.waitForMousePaused = 10
# Whether to wait for a mouse up before triggering a render texture resize
exts."omni.kit.widget.viewport".resize.waitForMouseUp = false
# Whether to update the camera projection while waiting for resize to complete
exts."omni.kit.widget.viewport".resize.updateProjection = false
# Whether to auto-attach a renderer to a Viewport (0=off, 1=on-stage-open, 2=on-viewport-creation)
exts."omni.kit.widget.viewport".autoAttach.mode = 0
# Setting to force a specific renderer for auto-attach (fallback is usual active renderer)
exts."omni.kit.widget.viewport".autoAttach.renderer = ""
# Setting to accelerate prim-query requests if possible
exts."omni.kit.widget.viewport".picking.rtx.accelerate = true
exts."omni.kit.widget.viewport".picking.rtx.timeout.resolve = 0.06

# Default focal-length for perspective cameras
persistent.app.primCreation.typedDefaults.camera.focalLength = 18.147562
# Set default clipping range for perspective cameras
persistent.app.primCreation.typedDefaults.camera.clippingRange = [1.0, 10000000.0]
# Set default clipping range for orthographic cameras
persistent.app.primCreation.typedDefaults.orthoCamera.clippingRange  = [1.0, 10000000.0]

[[test]]
pythonTests.exclude = [
    "omni.kit.widget.viewport.tests.test_ray_query.*",
    "omni.kit.widget.viewport.tests.test_scene_view_integration.*",
]
dependencies = [
    "omni.kit.test_helpers_gfx",
    "omni.hydra.rtx",
    "omni.hydra.pxr"
]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=rtx,pxr",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
    # Linux TC issues
    "--/rtx-transient/resourcemanager/genMipsForNormalMaps=false",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=false",
    "--/renderer/multiGpu/autoEnable=false",
]
# Test uses RTX and can incur shader-cache generation cost
timeout = 600


[[test]]
name = "autoAttach-1"
# Only need to re-run two open tests for this auto-attach mode
pythonTests.include = [
    "omni.kit.widget.viewport.tests.test_widget.test_widget_pre_open",
    "omni.kit.widget.viewport.tests.test_widget.test_widget_post_open",
]
dependencies = [
    "omni.kit.test_helpers_gfx",
    "omni.hydra.rtx",
]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=rtx",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
    # Linux TC issues
    "--/rtx-transient/resourcemanager/genMipsForNormalMaps=false",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=false",
    "--/renderer/multiGpu/autoEnable=false",
    "--/exts/omni.kit.widget.viewport/autoAttach/mode=1"
]
# Test uses RTX and can incur shader-cache generation cost
timeout = 600

[[test]]
name = "autoAttach-2"
# Only need to re-run two open tests for this auto-attach mode
pythonTests.include = [
    "omni.kit.widget.viewport.tests.test_widget.test_widget_pre_open",
    "omni.kit.widget.viewport.tests.test_widget.test_widget_post_open",
]
dependencies = [
    "omni.kit.test_helpers_gfx",
    "omni.hydra.rtx",
]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/content/emptyStageOnStart=false",
    "--/renderer/enabled=rtx",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
    # Linux TC issues
    "--/rtx-transient/resourcemanager/genMipsForNormalMaps=false",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=false",
    "--/renderer/multiGpu/autoEnable=false",
    "--/exts/omni.kit.widget.viewport/autoAttach/mode=2"
]
# Test uses RTX and can incur shader-cache generation cost
timeout = 600

[[test]]
name = "rtxAcceleratedPicking"
pythonTests.include = ["omni.kit.widget.viewport.tests.test_ray_query.*"]
dependencies = [
    "omni.kit.test_helpers_gfx",
    "omni.hydra.rtx",
]
args = [
    "--/exts/omni.kit.widget.viewport/picking/rtx/accelerate=true",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=rtx",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
    # Linux TC issues
    "--/rtx-transient/resourcemanager/genMipsForNormalMaps=false",
    "--/rtx-transient/resourcemanager/enableTextureStreaming=false",
    "--/renderer/multiGpu/autoEnable=false",
]
# Test uses RTX and can incur shader-cache generation cost
timeout = 600

[[test]]
name = "sceneView"
pythonTests.include = ["omni.kit.widget.viewport.tests.test_scene_view_integration.*"]
dependencies = [
    "omni.ui.scene",
    "omni.kit.test_helpers_gfx",
    "omni.hydra.pxr",
]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/active=pxr",
    "--/renderer/enabled=pxr",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
]


[[test]]
name = "sceneViewCameraModel"
pythonTests.include = ["omni.kit.widget.viewport.tests.test_scene_view_integration.*"]
dependencies = [
    "omni.kit.viewport.scene_camera_model",
    "omni.kit.test_helpers_gfx",
    "omni.hydra.pxr",
]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/active=pxr",
    "--/renderer/enabled=pxr",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=320",
    "--/app/window/height=240",
]
