    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/math.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/matrix.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/quat.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/range.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/rect.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/gf/vec.h",

    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/base/tf/token.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/base/vt/array.h",

    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/sdf/assetPath.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/sdf/path.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/sdf/types.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/sdf/valueTypeName.h",

    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/tokens.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/impl/usd_decl.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/attribute.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/common.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/prim.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/primRange.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/relationship.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/stage.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/timeCode.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/schemaRegistry.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/apiSchemaBase.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usd/*API.h",

    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/rt/tokens.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/rt/xformable.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/rt/boundable.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/rt/changeTracker.h",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/rt/primSelection.h",
