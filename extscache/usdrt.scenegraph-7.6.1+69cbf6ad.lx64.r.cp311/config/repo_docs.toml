    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/interface/Common.h",

    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usdGeom/*",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usdLux/*",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usdMedia/*",
    "${root}/_build/${platform}/${config}/dev/fabric/include/usdrt/scenegraph/usd/usdPhysics/*",
