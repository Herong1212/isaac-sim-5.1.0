[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.3"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Display in Viewport Menu Bar"
description="Adds a variety of display settings"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "menu", "viewport", "display"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Internal"
support_level = "Core"

[dependencies]
"omni.kit.viewport.menubar.core" = {}
"omni.kit.viewport.actions" = {}
"omni.kit.hotkeys.core" = { optional=true }

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.menubar.display".
[[python.module]]
name = "omni.kit.viewport.menubar.display"

[settings]
exts."omni.kit.viewport.menubar.display".visible = true
exts."omni.kit.viewport.menubar.display".order = -80
exts."omni.kit.viewport.menubar.display".showByType.exclude_list = ["Skeletons"]

[[test]]
dependencies = [
    "omni.kit.ui_test",
    # Because we test show-by-type sub-menu
    "omni.kit.viewport.legacy_gizmos",
    # Because we test for DeviceMemory HUD item
    "omni.hydra.engine.stats",
]
args = [
    "--/app/window/width=600",
    "--/app/window/height=400",
    "--/persistent/app/viewport/displayOptions=1568",
    "--/app/viewport/show/lights=false",
    "--/app/viewport/show/audio=false",
    "--/app/viewport/grid/enabled=false",
    "--/app/viewport/outline/enabled=false",
    "--/app/viewport/forceHideFps=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

stdoutFailPatterns.exclude = [
    "*Failed to convert event: type object 'omni.kit.usd.layers._omni_kit_usd_layers.LayerEven' has no attribute 'LIVE_SESSION_USER_JOINED'*",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/SETTINGS.md",
    "docs/USAGE_PYTHON.md",
]
