[package]
version = "0.1.14"
title = "Animation Timeline Widgets"
description = "An extensible timeline widget."
repository = ""
authors = ["NVIDIA"]
category = "Widget"
keywords = ["kit", "animation", "timeline"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

# Publish target
writeTarget.kit = true
writeTarget.usd = true

[[python.module]]
name = "omni.anim.widget.timeline"

[dependencies]
"omni.timeline" = {}
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.preferences.animation" = {}
"omni.usd" = {}

[[test]]
dependencies = ["omni.kit.test"]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/asyncRendering=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/ngx/enabled=false",
    "--/rtx/post/aa/op=0",
    "--/persistent/app/viewport/displayOptions=0",
    "--no-window",
]
timeout = 600
stdoutFailPatterns.exclude = []
