[package]
title = "debug draw"
category = "Rendering"
version = "0.1.4"

[deprecation]
warning = "Extension deprecated since Kit 106.0. omni.debugdraw is being replaced by omni.ui.scene."

[dependencies]
"omni.usd" = {}
"omni.hydra.rtx" = {optional=true}

[[python.module]]
name = "omni.debugdraw"

[[native.plugin]]
path = "bin/*.plugin"

[[test]]
timeout = 600

args = [
    "--/app/asyncRendering=false", # OM-49867 random test crashes without this flag
    "--/renderer/enabled=rtx",
    "--/renderer/active=rtx",
    "--/rtx/post/aa/op=0",
    "--/rtx/post/tonemap/op=1",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/app/viewport/show/lights=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=800",
    "--/app/window/height=600",
]

dependencies = [
    "omni.ui",
    "omni.kit.ui_test",
    "omni.hydra.rtx",
    "omni.kit.test_helpers_gfx",
    "omni.kit.viewport.utility",
    "omni.kit.viewport.window",
]
