  <style
     id="style1159">
	.base-highlight {
		fill: #76B900;
		stroke: #76B900;
		stroke-width: 15px;
	}
	.hint-text {
		fill: #76B900;
	}
  </style>
  <script
     type="text/javascript"
     id="script63"><![CDATA[
	
	function splitClusterText(string) {
		const breakpoint = /\||\(|\)/
		const splitted = string.split(breakpoint)
		return splitted
	}

	function getNodeGraphDefName(obj) {
		if(obj.classList.contains('top-cluster')) {
			var splittedText = splitClusterText(obj.children[1].innerHTML)
			return splittedText[1]
		} else if(obj.classList.contains('cluster')) {
			var splittedText = splitClusterText(obj.children[1].innerHTML)
			return splittedText[3]
		}
		return ""
	}
	
	function getNodeGraphDefInstancingNodeName(obj) {
		if(obj.classList.contains('cluster')) {
			var splittedText = splitClusterText(obj.children[1].innerHTML)
			return splittedText[0]
		}
		return ""
	}

	function getNodeGraphDefInstancingNodeInstance(obj) {
		if(obj.classList.contains('cluster')) {
			var splittedText = splitClusterText(obj.children[1].innerHTML)
			return splittedText[1]
		}
		return ""
	}

	function getTopology(obj) {
		var owningTopology = obj.getAttribute('topology')
		if(owningTopology) {
			var owningObj = document.getElementById(owningTopology);
			return getNodeGraphDefName(owningObj)
		}
		return ""
	}
	
	function makeBoldTxt(str) {
		return "<tspan font-weight=\"bold\">" + str +  "</tspan>"
	}
	
	function generateDescription(obj) {
		if(obj.classList.contains('top-cluster')) {
			return "The execution graph container holding " + makeBoldTxt(getNodeGraphDefName(obj)) + " NodeGraphDef."
		} else if(obj.classList.contains('cluster')) {
			var nodeGraphDef = makeBoldTxt(getNodeGraphDefName(obj))
			var node = makeBoldTxt(getNodeGraphDefInstancingNodeName(obj))
			var nodeIndex = makeBoldTxt(getNodeGraphDefInstancingNodeInstance(obj))
			var inTopology = makeBoldTxt(getTopology(obj))
			return "A node " + node + ", with local index " + nodeIndex + " in topology " + inTopology + ", holding " + nodeGraphDef + " NodeGraphDef."
		} else if(obj.classList.contains('node')) {
			return "An opaque node " + makeBoldTxt(obj.children[1].innerHTML) + " within " + makeBoldTxt(getTopology(obj)) + " topology."
		} else if(obj.classList.contains('root')) {
			return "A special root node allowing to discover all nodes in " + makeBoldTxt(getTopology(obj)) + " topology."
		} else if(obj.classList.contains('edge')) {
			return "An edge connecting two nodes in the same topology."
		} else {
			var description = document.getElementById('hint-description');
			return description.getAttribute('default-text')
		}
	}
	
	function mouseOverEffect() {
		this.children[0].classList.add("base-highlight");
		
		var description = document.getElementById('hint-description');
		description.innerHTML = generateDescription(this)
	}
	function mouseOutEffect() {
		this.children[0].classList.remove("base-highlight");
		
		var description = document.getElementById('hint-description');
		description.innerHTML = description.getAttribute('default-text')
	}
	
	var list = document.querySelectorAll(".node,.cluster,.top-cluster,.edge,.root");
	for (item of list) {
		item.addEventListener('mouseover', mouseOverEffect);
		item.addEventListener('mouseout', mouseOutEffect);
	}
	
	var description = document.getElementById('hint-description');
	description.innerHTML = description.getAttribute('default-text')
  ]]></script>
</svg>
