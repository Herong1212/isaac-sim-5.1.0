# when sphinx can't resolve a reference, we use this hook to look for the
# reference in the inventories we loaded above.
#
# this is a temporary hook which will eventually be integrated into repo_docs
sphinx_conf_py_extra = """
def tokenize_cpp(s):
    tokens = []
    start = 0
    end = 0
    saw_colon = False
    add_token = False
    less_count = 0

    i = 0
    for i in range(len(s)):
        c = s[i]
        if c == '<':
            saw_colon = False
            less_count = less_count + 1
        elif c == '>':
            less_count = less_count - 1
            if less_count == 0:
                end = i + 1
                add_token = True

        if less_count == 0:
            if saw_colon:
                if c == ':':
                    end = i - 1
                    add_token = True
                saw_colon = False
            else:
                saw_colon = (c == ':')

        if add_token:
            if end > start:
                tokens.append(s[start:end])
            add_token = False
            start = i + 1

    end = i + 1
    if end > start:
        tokens.append(s[start:end])

    return tokens

# called when sphinx can't resolve the reference
def handle_missing_reference(app, env, node, contnode):
    from docutils import nodes
    from docutils.utils import relative_path
    from sphinx.ext.intersphinx import InventoryAdapter
    from os import path
    import re

    inventories = InventoryAdapter(app.builder.env)

    reftarget = node['reftarget'] # the name of thing we're looking for

    domain = node.get('refdomain')
    if domain != "cpp" and domain != "c":
        return None

    # start to build up a list of targets to try
    to_try = [reftarget]
    if reftarget == "omni::core":
        # carbonite uses "exhale" for rst generation which doesn't use the
        # doxygennamespace directive but does create the explicit ref below
        to_try.append("namespace_omni__core")
    elif reftarget.startswith("omni::core::ObjectPtr<"):
         # sometimes we'll see a target like:
         #
         #   omni::core::ObjectPtr<IExecutionController>
         #
         # when trying to find the target for the "ObjectPtr" token.
        to_try.append("omni::core::ObjectPtr")
    elif reftarget.startswith("omni::core::ObjectParam<"):
         # sometimes we'll see a target like:
         #
         #   omni::core::ObjectParam<IExecutionController>
         #
         # when trying to find the target for the "ObjectParam" token.
        to_try.append("omni::core::ObjectParam")
    elif reftarget.startswith("omni::core::Inherits<"):
         # sometimes we'll see a target like:
         #
         #   omni::core::Inherits<omni::graph::exec::unstable::IExecutionContext, OMNI_TYPE_ID("omni.kit.exec.core.unstable.IExecutionContext")>
         #
         # when trying to find the target for the "Inherits" token.
        to_try.append("omni::core::Inherits")

    full_qualified_name = None
    if domain:
        # use the domain to come up with a contextual name for the target. for example:
        #
        #   graph::exec::unstable::Status
        #
        # would become:
        #
        #   omni::kit::exec::core::unstable::ParallelSpawner::schedule::graph::exec::unstable::Status
        #
        full_qualified_name = env.get_domain(domain).get_full_qualified_name(node)
        if full_qualified_name:
            # the name we computed usually isn't what we want, but does tell us
            # the context in which the target is being requested.
            to_try.append(full_qualified_name)

            # tokenize the string based on :: but be mindful of template arguments
            #
            #   input: '::j<a::b::g, a::x<a::b>>::b::c::d<e, a::f<>, a::b::g, h>::i::j<a::b::g>'
            #  output: ['j<a::b::g, a::x<a::b>>', 'b', 'c', 'd<e, a::f<>, a::b::g, h>', 'i', 'j<a::b::g>']
            tokens = tokenize_cpp(full_qualified_name)

            if full_qualified_name.startswith("omni::core::Generated<"):
                # breathe isn't able to figure out that targets in a
                # omni::core::Generated specialization should look in the context of
                # template argument of omni::core::Generated.  here we build up a
                # list of potential targets.
                #
                # so, if our target is ITopology, and the context is
                # omni::core::Generated<omni::graph::exec::INode_abi> we'll look
                # for:
                #
                #  omni::graph::exec::INode_abi::ITopology
                #  omni::graph::exec::ITopology
                #  omni::graph::ITopology
                #  omni::ITopology
                tokens = tokenize_cpp(tokens[2])
                template_arg = re.search(r"Generated<(.*)>", tokens[0]).group(1)

                tokens = tokenize_cpp(template_arg)

            for i in reversed(range(1, len(tokens) + 1)):
                will_try = f"{'::'.join(tokens[:i])}::{reftarget}"
                to_try.append(will_try)

    # because breathe doesn't fully understand how c++ name lookups work, we
    # explicity look in these namespaces
    to_try.append(f"omni::graph::exec::unstable::{reftarget}")
    to_try.append(f"omni::core::{reftarget}")

    # now that we've come up with a bunch of targets to try, look them up in our
    # current project
    refdoc = node.get('refdoc', env.docname)
    for target in to_try:
        newnode = env.domains[domain].resolve_xref(env, refdoc, app.builder, node['reftype'], target, node, contnode)
        if newnode:
            return newnode

    # couldn't find any of the target names.
    #
    # look up the target names in all of the external inventories we specified in repo.toml
    for name in inventories.named_inventory.keys():
        inventory = inventories.named_inventory[name]
        for target in to_try:
            for objtype in inventory.keys():
                if target not in inventory[objtype]:
                    continue
                proj, version, uri, dispname = inventory[objtype][target]

                # fix up the relative path
                if '://' not in uri and node.get('refdoc'):
                    # get correct path in case of subdirectories
                    uri = path.join(relative_path(node['refdoc'], '.'), uri)

                # create the hover-over tool-tip text
                if version:
                    reftitle = '(in %s v%s)' % (proj, version)
                else:
                    reftitle = '(in %s)' % (proj,)

                newnode = nodes.reference('', '', internal=False, refuri=uri, reftitle=reftitle)
                if node.get('refexplicit'):
                    # use whatever title was given
                    newnode.append(contnode)
                else:
                    # else use the given display name (used for :ref:)
                    dispname = contnode.astext()
                    newnode.append(contnode.__class__(dispname, dispname))

                return newnode

    # point to cppreference.com for some known built-in c++ types
    integers = { "uint64_t", "int64_t", "uint32_t", "int32_t" }
    if reftarget in integers:
        newnode = nodes.reference('', '', internal=False, refuri="https://en.cppreference.com/w/cpp/types/integer")
        dispname = contnode.astext()
        newnode.append(contnode.__class__(dispname, dispname))
        return newnode

    return None

sphinx_event_handlers.append(("missing-reference", handle_missing_reference))

