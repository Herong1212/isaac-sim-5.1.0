# disable generation of docs pages for external projects
api_item_filters = [
    # tell rebreather to not generate dedicated .rst pages for any entities
    # (e.g. class, struct) from external packages (e.g. carb headers).
    #
    # we'll use the "missing-reference" hook above to link references to these
    # excluded classes/structs/etc to the original documentation in the external
    # project.
    { attribute="location.path", rule="exclude", matching="*/_build/target-deps/*" },
    { attribute="location.path", rule="exclude", matching="*/packman-repo*" }, # linux
    { attribute="location.path", rule="exclude", matching="*/pm/chk*" }, # tc

    # rebreather will want to generate .rst pages for the directories in _build.
    # here we tell rebreather to ignore these files.
    { attribute="path", rule="exclude", matching="*/_build/*" },
    { attribute="path", rule="exclude", matching="*/_build" },
    { attribute="path", rule="exclude", matching="*packman-repo*" }, # linux
    { attribute="path", rule="exclude", matching="*pm/chk*" }, # tc

    # make sure undocumented.h doesn't show up in the TOC
    { attribute="path", rule="exclude", matching="Undocumented.h" },

    # remove docs for the std namespace
    { attribute="full_name", rule="exclude", matching="std" },

    # remove docs for std specialization (e.g. std::hash)
    { attribute="full_name", rule="exclude", matching="std::*" },

    # for some reason this is labeled as a namespace?!?
    { attribute="full_name", rule="exclude", matching="EnumBitops" },
]
