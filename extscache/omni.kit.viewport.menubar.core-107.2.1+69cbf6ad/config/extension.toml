[package]
# Semantic Versioning is used: https://semver.org/
version = "107.2.1"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport Menu Bar Core API"
description="Adds a variety of functionality to a viewport by adding a menu-bar and items at the top"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "menu", "viewport"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Internal"
support_level = "Core"

[dependencies]
"omni.ui" = {}
"omni.usd" = {}
"omni.kit.viewport.registry" = {}
"omni.kit.widget.spinner" = { optional = true }
"omni.kit.window.cursor" = { optional = true }
"omni.kit.window.preferences" = {}
"omni.kit.widget.settings" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.menubar.core".
[[python.module]]
name = "omni.kit.viewport.menubar.core"

[settings]
exts."omni.kit.viewport.menubar.core".spacer.order = 0

[[test]]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.viewport.utility",
    "omni.kit.widget.spinner",
    "omni.kit.material.library",
    "omni.kit.ui_test",
]
args = [
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

[[test]]
name="no_spinner"
pythonTests.include = [
    "omni.kit.viewport.menubar.core.tests.test_ui.TestExampleMenuWindow.test_left*",
]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.viewport.utility",
    "omni.kit.material.library",
    "omni.kit.ui_test",
]
args = [
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/USAGE_PYTHON.md",
]
