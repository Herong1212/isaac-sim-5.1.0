[package]
title = "OmniPhysics StageUpdate"
description="OmniPhysics StageUpdate Connection."
repository = ""
keywords = ["physics"]
category = "Simulation"
authors = ["NVIDIA"]

version = "107.3.26"

icon = "data/icon.png"
preview_image = "data/preview.png"
