[core]
reloadable = false
# Load at the start, load all schemas with order -100 (with order -1000 the USD libs are loaded)
order = -100

[package]
category = "Internal"
title = "USD semantics schema"
description="USD semantics schema"
support_level = "Sample"

[dependencies]
"omni.usd.libs" = {}

[[python.module]]
name = "pxr"

[[python.module]]
name = "Semantics"

[[python.module]]
name = "usd.schema.semantics"

[[native.library]]
"filter:os".linux.path = "lib/${lib_prefix}semantics${lib_ext}"
"filter:os".windows.path = "bin/${lib_prefix}semantics${lib_ext}"

[[test]]
waiver = "USD Schema, tested externally"
