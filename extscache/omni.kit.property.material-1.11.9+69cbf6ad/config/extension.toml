[package]
# Semantic Versioning is used: https://semver.org/
version = "1.11.9"
category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Material Property Widget"
description="View and Edit Material Property Values"

# URL of the extension source repository.
repository = ""
support_level = "Core"

# Preview image. Folder named "data" automatically goes in git lfs (see .gitattributes file).
preview_image = "data/preview.png"

# Keywords for the extension
keywords = ["kit", "usd", "property", "material"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

[dependencies]
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.window.property" = {}
"omni.kit.material.library" = {}
"omni.kit.property.usd" = {}
"omni.client" = {}
"omni.kit.window.quicksearch" = { optional = true }
"omni.kit.usd.mdl" = {}
"omni.kit.window.preferences" = {}

[settings]
ext."omni.kit.property.material".enableAdapter = false

[[python.module]]
name = "omni.kit.property.material"

[[test]]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/persistent/app/stage/dragDropImport='reference'",
    "--/persistent/app/material/dragDropMaterialPath='absolute'",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/persistent/app/properties/material/displayBaseShader=true",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.window.status_bar",
    "omni.kit.window.stage",
    "omni.kit.window.file_importer",
    "omni.kit.window.content_browser",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.window.content_browser",
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md"]
