[package]
# Semantic Versioning is used: https://semver.org/
version = "1.0.5"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "UI Actions and Hotkeys"
description="General UI Actions and Hotkeys"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "actions", "hotkeys"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Internal"
support_level = "Sample"

[dependencies]
"omni.kit.hotkeys.core" = { optional=true }
"omni.ui" = {}
"omni.kit.context_menu" = {}
"omni.appwindow" = {}

# Main python module this extension provides, it will be publicly available as "import omni.kit.ui.actions".
[[python.module]]
name = "omni.kit.ui.actions"

[settings]
# register F7/F11/+/- hotkeys. Do not enable if "omni.kit.menu.common" is loaded as that also registers the hotkeys
exts."omni.kit.ui.actions".ui_hotkeys = false
exts."omni.kit.ui.actions".ui_hotkey_escape = true

[[test]]
dependencies = [
    "omni.kit.property.usd",
    "omni.kit.window.stage",
    "omni.kit.test_suite.helpers",
]
args = [
    "--/app/window/hideUi=true", # Start with this true to test action can handle it without an error
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/SETTINGS.md",
]
