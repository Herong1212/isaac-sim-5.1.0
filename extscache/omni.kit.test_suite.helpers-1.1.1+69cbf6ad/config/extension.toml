[package]
# Semantic Versioning is used: https://semver.org/
version = "1.1.1"

category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "omni.kit.test_suite.helpers"
description="Small set of internal test suite helpers."
readme = "docs/README.md"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "test"]
support_level = "Sample"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

[dependencies]
"omni.usd" = {}
"omni.kit.ui_test" = {}
"omni.kit.viewport.utility" = {}

[[python.module]]
name = "omni.kit.test_suite.helpers"

[[test]]
name = "main"
timeout = 600

args = [
    "--/renderer/enabled=rtx",
    "--/renderer/active=rtx",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/persistent/app/stage/dragDropImport='reference'",
    "--/persistent/app/material/dragDropMaterialPath='absolute'",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/persistent/app/properties/material/displayBaseShader=true",
    # OM-104254: Synchronize loading in order to prevent TC failures when kit is closed while loading.
    "--/rtx/materialDb/syncLoads=true",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
    # OM-87744: Switch the event loop on Windows to avoid the _overlapped.Overlapped error. This error may have started
    # showing up with the 3.7 -> 3.10 Python upgrade because with 3.8 the default event loop policy changed on Windows
    # from WindowsSelectorEventLoopPolicy to WindowsProactorEventLoopPolicy.
    # May be related to https://github.com/python/cpython/issues/82979
    "--/exts/omni.kit.async_engine/event_loop_windows=SelectorEventLoop",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.window.status_bar",
    "omni.hydra.rtx",
    "omni.kit.material.library",
    "omni.kit.property.material",
    "omni.kit.viewport.window",
    "omni.kit.widget.stage",
    "omni.kit.window.file_importer",
    "omni.kit.window.stage",
    "omni.kit.window.content_browser",
    "omni.kit.context_menu",
]


stdoutFailPatterns.exclude = [
]

pythonTests.unreliable = [
]
