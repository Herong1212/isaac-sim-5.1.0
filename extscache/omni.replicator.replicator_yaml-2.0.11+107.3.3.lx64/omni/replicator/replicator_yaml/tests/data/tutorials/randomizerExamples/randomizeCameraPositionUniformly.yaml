sphere:
  create.sphere:
    semantics: [["class", "sphere"]]
    position: [0, 100, 100]
cube:
  create.cube:
    semantics: [["class", "cube"]]
    position: [200, 200, 100]
plane:
  create.plane:
    semantics: [["class", "plane"]]
    visible: true

# Put create camera and attach render product to other base yaml.
camera:
  create.camera:
    focus_distance: 800
    f_stop: 0.5

render_product:
  create.render_product:
    camera: camera
    resolution: [512, 512]

# End of creation of camera and render product

# Put create writer and initialize to other base yaml.

writer:
  writers.get:
    name: "BasicWriter"
    init_params:
      output_dir: "_output_yaml"
      rgb: True
      bounding_box_2d_tight: True
    render_products: render_product

# End of writer

trigger:
  trigger.on_frame:
    max_execs: 10

with_trigger:
  with.trigger:
    with.camera:
      modify.pose:
        position:
          distribution.uniform:
            lower: [-500, 200, 100]
            upper: [500, 500, 500]
          look_at: [0,0,0]