camera:
  create.camera:
    position: [0, 0, 1000]

render_product:
  create.render_product:
    camera: camera
    resolution: [1024, 1024]

sphere:
  create.sphere:
    semantics: [["class", "sphere"]]
    position: [0, 100, 100]
cube:
  create.cube:
    semantics: [["class", "cube"]]
    position: [100, -200, 100]
torus:
  create.torus:
    semantics: [["class", "torus"]]
    position: [0, -200, 100]


# Put create writer and initialize to other base yaml.
writer:
  writers.get:
    name: "BasicWriter"
    init_params:
      output_dir: "_output_yaml"
      rgb: True
      bounding_box_2d_loose: True
      bounding_box_2d_tight: True
      bounding_box_3d: True
      distance_to_camera: True
      distance_to_image_plane: True
      instance_segmentation: True
      normals: True
      semantic_segmentation: True
    render_products: render_product

trigger:
  trigger.on_frame:
    max_execs: 10

with_trigger:
  with.trigger:
    group:
      create.group:
        items: ['torus', 'sphere', 'cube']
    with.group:
      modify.pose:
        position:
          distribution.uniform:
            lower: [-100, -100, -100]
            upper: [200, 200, 200]
          scale:
            distribution.uniform:
              lower: 0.1
              upper: 2
