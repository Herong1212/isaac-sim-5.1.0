stage_unit_setting:
  settings.set_stage_meters_per_unit:
    meters_per_unit: 1

stage_up_axis_setting:
  settings.set_stage_up_axis:
    up_axis: Z

render_aa:
  settings.set_render_rtx_realtime:
    antialiasing: DLAA

sphere:
  create.sphere:
    semantics: [["class", "sphere"]]
    position: [1, 0, 1]
cube:
  create.cube:
    semantics: [["class", "cube"]]
    position: [1, 2, 2]
plane:
  create.plane:
    semantics: [["class", "plane"]]
    visible: true
    scale: 10


register_sphere_light:
  randomizer.register:
    sphere_lights:
      inputs:
        num: 1
      sphere_light:
        create.light:
          light_type: "Sphere"
          temperature:
            distribution.normal:
              mean: 6500
              std: 500
          intensity:
            distribution.normal:
              mean: 35000
              std: 5000
          position:
            distribution.uniform:
              lower: [-3, -3, -3]
              upper: [3, 3, 3]
          scale:
            distribution.uniform:
              lower: 0.5
              upper: 1
          count: num

trigger:
  trigger.on_frame:
    max_execs: 10
    rt_subframes: 5

with_trigger:
  with.trigger:
    randomizer.sphere_lights:
      num: 10

camera:
  create.camera:
    position: [5, 0, 0]

render_product:
  create.render_product:
    camera: camera
    resolution: [1024, 1024]

writer:
  writers.get:
    name: "BasicWriter"
    init_params:
      output_dir: "_output"
      rgb: True

writer_attach:
  writer.attach:
    render_products: render_product
