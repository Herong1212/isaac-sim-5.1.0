# https://docs.omniverse.nvidia.com/extensions/latest/ext_replicator/randomizer_details.html#randomizing-pose-position-rotation-and-scale
stage_unit_setting:
  settings.set_stage_meters_per_unit:
    meters_per_unit: 1

stage_up_axis_setting:
  settings.set_stage_up_axis:
    up_axis: "Z"

sphere:
  create.sphere:
    semantics: [["class", "sphere"]]
    position: [1, 0, 1]
cube:
  create.cube:
    semantics: [["class", "cube"]]
    position: [1, 2, 2]

# plane removed to avoid render artifacts affecting testing
# plane:
#   create.plane:
#     semantics: [["class", "plane"]]
#     visible: true
#     scale: 10

# Unused - preserves randomizer node ID after functional improvements.
unused:
  distribution.uniform:
    lower: -1
    upper: 1
unused2:
  distribution.uniform:
    lower: -1
    upper: 1

register_move_shapes:
  randomizer.register:
    move_shapes:
      shapes:
        get.prims:
          semantics: [['class', 'cube'], ['class', 'sphere']]
      with.shapes:
        modify.pose:
          position:
            distribution.uniform:
              lower: [-5, -5, 0.5]
              upper: [5, 5, 0.5]
          rotation:
            distribution.uniform:
              lower: [0, 0, -180]
              upper: [0, 0, 180]
          scale:
            distribution.normal:
              mean: 1.0
              std: 0.5

trigger:
  trigger.on_frame:
    max_execs: 30

with_trigger:
  with.trigger:
    randomizer.move_shapes: null

camera:
  create.camera:
    position: [5, 0, 0]

render_product:
  create.render_product:
    camera: camera
    resolution: [1024, 1024]

writer:
  writers.get:
    name: "BasicWriter"
    init_params:
      output_dir: "_output"
      rgb: True

writer_attach:
  writer.attach:
    render_products: render_product
