[package]
# Semantic Versionning is used: https://semver.org/
version = "1.0.27"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Thumbnail generator for MDL"
description="Generate thumbail for MDL files if required."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ['kit', 'thumbnails', "mdl"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Internal"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

writeTarget.kit = true

[dependencies]
"omni.kit.viewport.utility" = {}
"omni.kit.widget.viewport" = {}
"omni.kit.window.preferences" = {}
"omni.usd" = {}
# Capture currently will always capture with RTX renderer
"omni.kit.viewport.rtx" = {}
# Write to file via omni.client so it can be saved to remote/nucleus path
"omni.client" = {}

[[python.module]]
name = "omni.kit.thumbnails.mdl"

[settings]
exts."omni.kit.thumbnails.mdl".mdl.template_path = ""
exts."omni.kit.thumbnails.mdl".mdl.stdin = "/Root/Material_Standin"
exts."omni.kit.thumbnails.mdl".mdl.render_mode = "PathTracing"
exts."omni.kit.thumbnails.mdl".mdl.render_samples = 8

exts."omni.kit.thumbnails.mdl".usd.template_path = ""
exts."omni.kit.thumbnails.mdl".usd.stdin = "/Root/Material_Standin"
exts."omni.kit.thumbnails.mdl".usd.render_mode = "PathTracing"
exts."omni.kit.thumbnails.mdl".usd.render_samples = 8

exts."omni.kit.thumbnails.mdl".clearSelection = true

[[test]]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/renderer/enabled=pxr",
    "--/renderer/active=pxr",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window",
    "--/app/hydraEngine/waitIdle=true",
    "--/app/asyncRendering=false",
]

stdoutFailPatterns.exclude = [
    "* UsdToMdl: Reached invalid assignment for parameter*",
    "*Failed to read texture file*",
    "*Failed to load texture*",
    "*Failed to upload DomeLight texture*",
    "*Prim * parameter *: Reached invalid assignment*",
]

[documentation]
pages = ["docs/CHANGELOG.md"]
