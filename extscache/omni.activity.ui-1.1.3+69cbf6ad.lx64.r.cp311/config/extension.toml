[package]
title = "Activity Window"
description = "Activity window displaying high-level and detailed file loading progress"
feature = true
version = "1.1.3"
category = "UI"
authors = ["NVIDIA"]
repository = ""
keywords = ["activity", "window", "ui"]
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"
preview_image = "data/preview.png"
support_level = "Sample"
readme = "docs/Overview.md"

[dependencies]
"omni.activity.core" = {}
"omni.activity.profiler" = {}
"omni.activity.pump" = {}
"omni.activity.usd_resolver" = {}
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.kit.window.file" = {}
"omni.kit.usd.layers" = {optional=true}
"omni.kit.menu.utils" = {optional=true}

[[native.library]]
path = "bin/${lib_prefix}omni.activity.ui.bar${lib_ext}"

[[python.module]]
name = "omni.activity.ui"

[settings]
exts."omni.activity.ui".auto_save_location = "${cache}/activities"

[[test]]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]
dependencies = [
    "omni.kit.usd.layers",
    "omni.kit.menu.utils",
    "omni.kit.ui_test",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
