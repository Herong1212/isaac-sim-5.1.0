[package]
# Semantic Versioning is used: https://semver.org/
version = "1.1.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Timeline live synchronization extension"
description="An extension to provide synchronization of the timeline between live session users"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["live", "session", "timeline", "live-session"]
support_level = "Sample"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

icon = "data/icon.png"

[dependencies]
"omni.timeline" = {}
"omni.kit.notification_manager" = {}
"omni.kit.collaboration.presence_layer" = {}
"omni.kit.usd.layers" = {}
"omni.ui" = {}

# Main python module this extension provides, it will be publicly available as "import omni.timeline.live_session".
[[python.module]]
name = "omni.timeline.live_session"

[[test]]
args = [
    "--/app/asyncRendering=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/renderer/active=pxr",
    "--/renderer/enabled=pxr",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/rtx/materialDb/syncLoads=true",
]

dependencies = [
    "omni.kit.collaboration.channel_manager",
    "omni.kit.ui_test",
]

stdoutFailPatterns.exclude = [
    # suppress error log for UI tests
    "*[Error] [omni.timeline.live_session.timeline_session] Session must be running to*"
]
