[package]
# Semantic Versionning is used: https://semver.org/
version = "1.3.10"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Hotkey Core APIs"
description = "The Hotkeys Core extension is a framework for creating, registering, and discovering hotkeys."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ['hotkey', 'core', 'api']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Internal"
support_level = "Core"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/hotkey_editor.svg"


[dependencies]
"omni.kit.actions.core" = {}
"omni.ui" = {}

# Main python module this extension provides, it will be publicly available as "import omni.hotkeys.core".
[[python.module]]
name = "omni.kit.hotkeys.core"

[settings.exts."omni.kit.hotkeys.core"]
context = ""
default_keyboard_layout = "U.S. QWERTY"
allow_list = []
# Set this to false to globally disable all hotkeys. They will be registered, but no action will be trigered
hotkeys_enabled = true

[[test]]
dependencies = [
    "omni.kit.ui_test",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/USAGE.md",
]
