[package]
version = "107.3.109"
title = "XR Core Infrastructure"
description="Core infrastructure for doing XR inside Kit"
readme  = "docs/README.md"
category = "XR"
keywords = ["XR", "Extended Reality", "Opt out of nSpect"]
changelog="docs/CHANGELOG.md"

authors = ["NVIDIA"]
icon = "data/icon/iconxr.png"
preview_image = "data/icon/preview.png"
repository = ""
support_level = "Core"

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.renderer.core" = {}
"omni.kit.test" = {}
"omni.rtx.window.settings" = { optional=true }
"omni.kit.viewport.utility" = {}
"omni.kit.viewport.window" = {}
"omni.kit.window.content_browser" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.window.preferences" = {}
"omni.hydra.rtx" = {}
"usdrt.scenegraph" = {}
"omni.kit.menu.utils" = {}
"omni.hydra.usdrt_delegate" = {}

[[python.module]]
name = "omni.kit.xr.core"

[[python.module]]
name = "omni.kit.xr.core.tests"

[[python.module]]
name = "omni.kit.xr.core.imagecomparison"

[[python.module]]
name = "omni.kit.xr.core.recorder"

[[native.plugin]]
path = "bin/omni.kit.xr.core.plugin"

[settings]
xr.enabled = true
xr.persistence.enabled = true
persistent.xr.ui.interactFreezeDelay = 0.4
renderer.enabled = "rtx"
renderer.active = "rtx"
xr.manifests."omni.kit.xr.core" = "xrmanifests"
xr.assets."omni.kit.xr.core" = "xrassets"
defaults.xr.system.openxr.xcr.replay.replayFile = ""

[[test]]
pythonTests.include = ["omni.kit.xr.core.tests.*test_unit*"]

args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/testMode=1",
    "--/app/content/emptyStageOnStart=0",
    "--/persistent=0",
    "--/xr/persistence/enabled=false",
    "--reset-user",
    "--/xr/debug=true",
    "--/no-assert-dialog=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/docks/disabled=true",
    "--/app/window/hideUi=true",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/log/channels/omni.usd=error"
]

timeout = 3600
retries = 1

stdoutFailPatterns.exclude = [
    "shaderGroupHandle changed for shader group*",
    "*IRAY*",
    "*SBT*",
    "*neuray*",
    "*Failed opening shader cache version file*",
    "*[omni.kit.viewport.menubar.camera.camera_menu_container]*",
    "*OpenXR-Loader*",
    "*[carb.imgui.plugin] Unable to load IWindowing!*"
]

[documentation]
python_api_hidden = true
