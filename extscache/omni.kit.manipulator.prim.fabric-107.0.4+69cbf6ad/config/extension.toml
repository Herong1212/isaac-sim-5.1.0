[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.4"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
description = "Prim Manipulator Fabric Data Accessor Extension"
title = "Prim Manipulator Fabric Data Accessor"

# Path (relative to the root) or content of readme markdown file for UI.
readme = "docs/README.md"

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Scene"
support_level = "Core"

# Keywords for the extension
keywords = ["kit", "manipulator", "usd", "prim"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

[dependencies]
"omni.kit.manipulator.prim.core" = {}
"omni.kit.viewport.manipulator.transform" = {}
"omni.usd" = {}
"usdrt.scenegraph" = {}
"omni.fabric.commands" = {}


# Main python module this extension provides, it will be publicly available as "import omni.example.hello".
[[python.module]]
name = "omni.kit.manipulator.prim.fabric"

# [settings]
# exts."omni.kit.manipulator.prim.core".tools.enabled = true
# exts."omni.kit.manipulator.prim.core".visual.delayFrame = 0  # default to 0 to turn this experimental off. 3 is a resonable number for rtx
# persistent.exts."omni.kit.manipulator.prim.core".manipulator.placement = "Authored Pivot"
# persistent.exts."omni.kit.manipulator.selector".orders."omni.kit.manipulator.prim.core" = -1

[[test]]
waiver = "Covered by `omni.kit.manipulator.prim.core`"

[settings]
exts."omni.kit.manipulator.prim.core".accessor.priority.fabric = 2
exts."omni.kit.manipulator.prim.core".accessor.prioritywrite.fabric = 2

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md", "docs/USAGE_PYTHON.md"]
