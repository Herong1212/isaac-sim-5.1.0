[package]
# Semantic Versioning is used: https://semver.org/
version = "107.2.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport Window"
description="New OmniUI Based HydraEngine Viewport"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "viewport", "hydra", "rtx", "render"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"
preview_image = "data/preview.png"

category = "Rendering"
support_level = "Core"

[dependencies]
"omni.ui" = {}
"omni.usd" = {}
"omni.ui.scene" = {}
"omni.timeline" = {}
"omni.kit.viewport.registry" = {}
"omni.kit.widget.viewport" = {}
# Very -optional- dependencies
# Not available until 103.1
"omni.hydra.engine.stats" = { optional = true }
# Not available in all versions app will probably own loading
"omni.kit.viewport.legacy_gizmos" = { optional = true }
# Viewportwindow has external drag-drop support, but it's optional
"omni.kit.window.drop_support" = { optional = true }
# Add to the Window menu
"omni.kit.menu.utils" = { optional = true }
"omni.kit.actions.core" = {}
"omni.kit.material.library" = { optional = true }
"omni.kit.raycast.query" = { optional = true }
"omni.kit.usd.layers" = { optional = true }

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.window".
[[python.module]]
name = "omni.kit.viewport.window"

[settings]
# Default name of the ViewportWindow
exts."omni.kit.viewport.window".startup.windowName="Viewport"
# Setting to disable opening a Window instance when loaded
exts."omni.kit.viewport.window".startup.disableWindowOnLoad=false
# Whether to hide the Viewport's docking tab when created
exts."omni.kit.viewport.window".startup.dockTabInvisible=true
# Whether multiple Viewports startup with tabs overlapped (exclusive viewing) or quad-like layout.
exts."omni.kit.viewport.window".startup.singleTabGroup=false
# The number of "Viewport" menu-item entries available for use
exts."omni.kit.viewport.window".windowMenu.entryCount=2
# A list of string to label the "Viewport" menu-item as
# An empty list (or empty slot in the list) will use default labeling
exts."omni.kit.viewport.window".windowMenu.entryLabels=[]
# Name of top-level "Viewport" menu entry that holds all of the entries
exts."omni.kit.viewport.window".windowMenu.label="Viewport"

# Similar per-Viewport control of startup options
exts."omni.kit.viewport.window".startup.windowNames=[]
exts."omni.kit.viewport.window".startup.showOnLaunch=[]

# Whether to automatically disable updates to the Viewport when it is made invisible
# Application-level setting like /app/renderer/skipWhileMinimized is
app.renderer.skipWhileInvisible=true

# Max allowed distance for drag-drop plane intersection test
exts."omni.kit.viewport.window".dragDrop.maxPlaneDistance=0
# Valid modes 'x', 'y', 'z', 'ground', 'object', ''
exts."omni.kit.viewport.window".dragDrop.intersectMode="ground"

# Default visibility for HUD items (can enable thes when displayOptions are gone)
# app.viewport.defaults.hud.renderFPS.visible = true
# app.viewport.defaults.hud.deviceMemory.visible = true
# app.viewport.defaults.hud.hostMemory.visible = true
# app.viewport.defaults.hud.renderProgress.visible = true
# app.viewport.defaults.hud.renderResolution.visible = true
app.viewport.defaults.hud.cameraSpeed.visible = true
app.viewport.defaults.hud.toastMessage.visible = true

# Whether a double click in the Viewport will change the camera's center-of-interest
exts."omni.kit.viewport.window".coiDoubleClick=false

# Whether to use omni.kit.raycast.query (if available) instead of request_query from hydra texture
exts."omni.kit.viewport.window".useRaycastQuery = true

# Camera speed hud
persistent.exts."omni.kit.viewport.window".cameraSpeedMessage.collapsed = false
exts."omni.kit.viewport.window".cameraSpeedMessage.seconds = 5.0
exts."omni.kit.viewport.window".cameraSpeedMessage.fadeIn = 0.5
exts."omni.kit.viewport.window".cameraSpeedMessage.fadeOut = 0.5

# Contexts where a camera speed change will be limited
exts."omni.kit.viewport.window".cameraSpeedLimit.0="scroll"
exts."omni.kit.viewport.window".cameraSpeedLimit.1="text"
exts."omni.kit.viewport.window".cameraSpeedLimit.2="gamepad"

# Types of memory info to show in the HUD stats ("device", "process", "host")
exts."omni.kit.viewport.window".hud.memoryTypes=["device", "process"]

# Camera axis default size
app.viewport.defaults.guide.axis.size = [60, 60]


[documentation]
pages = [
    "docs/Overview.md",
    "docs/Settings.md",
    "docs/CHANGELOG.md",
]


[[test]]
pythonTests.exclude = [
    "omni.kit.viewport.window.tests.test_window_layout*",
]
dependencies = [
    "omni.kit.window.drop_support",
    "omni.kit.ui_test",
    "omni.kit.manipulator.camera",
    "omni.hydra.pxr",
    "omni.kit.menu.utils",
    "omni.kit.context_menu",
]
args = [
    "--/renderer/enabled=pxr",
    "--/app/asyncRendering=false",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/viewport/forceHideFps=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/app/viewport/defaults/hud/cameraSpeed/visible=false",
    "--/exts/omni.kit.viewport.window/hud/memoryTypes/0=''",
    "--/exts/omni.kit.viewport.window/hud/memoryTypes/1=''",
    "--/app/window/width=360",
    "--/app/window/height=240",
]
stdoutFailPatterns.exclude = [
    "*TypeError: unsupported operand type(s)*", # Leak
    "*Cannot import materials as omni.kit.material.library isn't loaded*",
]

[[test]]
name="layout_baseline"
pythonTests.include = [
    "omni.kit.viewport.window.tests.test_window_layout*",
]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.menu.utils",
    "omni.kit.context_menu",
]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/app/window/width=360",
    "--/app/window/height=240",
    "--/exts/omni.kit.viewport.window/testLayout=1",
]

[[test]]
name="layout_custom"
pythonTests.include = [
    "omni.kit.viewport.window.tests.test_window_layout*",
]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.uiapp",
    "omni.kit.ui_test",
    "omni.kit.menu.utils",
    "omni.kit.context_menu",
]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/app/window/width=360",
    "--/app/window/height=240",
    "--/exts/omni.kit.viewport.window/testLayout=2",
    "--/exts/omni.kit.viewport.window/windowMenu/label='CUSTOM NAME'",
    "--/exts/omni.kit.viewport.window/windowMenu/entryCount=5",
    "--/exts/omni.kit.viewport.window/windowMenu/entryLabels/0='VIEWPORT A - {index} {index_1}'",
    "--/exts/omni.kit.viewport.window/windowMenu/entryLabels/2='{index} - VIEWPORT C - {index_1}'",
    "--/exts/omni.kit.viewport.window/windowMenu/entryLabels/3='{index_1} - VIEWPORT D - {index}'",
]

[[test]]
name="layout_flat_single"
pythonTests.include = [
    "omni.kit.viewport.window.tests.test_window_layout*",
]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.menu.utils",
    "omni.kit.context_menu",
]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/app/window/width=360",
    "--/app/window/height=240",
    "--/exts/omni.kit.viewport.window/testLayout=3",
    "--/exts/omni.kit.viewport.window/windowMenu/label=''",
    "--/exts/omni.kit.viewport.window/windowMenu/entryCount=1",
]


[[test]]
name="layout_flat"
pythonTests.include = [
    "omni.kit.viewport.window.tests.test_window_layout*",
]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.menu.utils",
    "omni.kit.context_menu",
]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/exts/omni.kit.viewport.window/startup/disableWindowOnLoad=true",
    "--/app/window/width=360",
    "--/app/window/height=240",
    "--/exts/omni.kit.viewport.window/testLayout=4",
    "--/exts/omni.kit.viewport.window/windowMenu/label=''",
    "--/exts/omni.kit.viewport.window/windowMenu/entryCount=5",
