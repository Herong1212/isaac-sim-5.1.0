[package]
title = "Scene Visualization System"
category = "Rendering"
version = "107.0.2"

icon = "data/icon.png"
preview_image = "data/icon.png"
changelog = "docs/CHANGELOG.md"
readme = "docs/index.rst"
description="Debug line/point/etc drawing interface."
authors = ["NVIDIA"]

# URL of the extension source repository.
repository = ""

# Main module for the Python interface
[[python.module]]
name = "omni.scene.visualization.core"

# Keywords for the extension
keywords = ["debugdraw"]

# Extensions required to load before this one
[dependencies]
"omni.usd" = {}
"omni.debugdraw" = {}
"omni.graph" = {}
"omni.usd.schema.scene.visualization" = {}
"usdrt.scenegraph" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

# Avoid test failure due to error message in ImageProvider when renderer
# interface cannot be acquired
[[test]]
args = [
    "--/renderer/enabled=rtx",
    "--/renderer/active=rtx",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/hideUi=true",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/app/viewport/show/lights=false",
    "--/app/viewport/outline/enabled=false",
    "--no-window",
]

dependencies = [
    "omni.hydra.pxr",
    "omni.hydra.rtx",
    "omni.kit.stage_templates",
    "omni.kit.test_helpers_gfx",
    "omni.kit.viewport.window",
    "omni.kit.viewport.utility",
]

[package.writeTarget]
kit = true
usd = true
