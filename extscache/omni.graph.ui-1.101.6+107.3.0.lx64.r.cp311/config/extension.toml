[package]
title = "OmniGraph UI"
version = "1.101.6"
category = "Graph"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
description = "Contains all of the UI specific to the OmniGraph."
preview_image = "data/preview.png"
icon = "data/icon.svg"
repository = ""
keywords = ["kit", "omnigraph", "ui", "editor"]
writeTarget.kit = true
support_level = "Sample"

# The location of this module's python scripts
[[python.module]]
name = "omni.graph.ui"

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

# Watch the .ogn files for hot reloading (only works for Python files)
[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

# In addition to using the OmniGraph code the editor functionality is used for the node description editor
[dependencies]
"omni.graph.core" = { version = "2.177.1" }
"omni.graph" = { version = "1.139.0" }
"omni.inspect" = {optional = true}
"omni.kit.commands" = {}
"omni.kit.widget.prompt" = {}
"omni.kit.widget.settings" = {}
"omni.kit.widget.text_editor" = {} # For use in node template UI
"omni.kit.widget.stage" = {optional = true}
"omni.kit.widget.context_menu" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.window.file_importer" = {} # For the target picker dialog
"omni.kit.viewport.utility" = {}
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.ui_query" = {}
"omni.usd" = {}
"omni.kit.pip_archive" = {}
"omni.kit.window.property" = {}
"omni.kit.property.usd" = {}
"omni.kit.menu.utils" = {}
"omni.kit.window.preferences" = {}
"omni.kit.window.extensions" = {optional = true}
"omni.timeline" = {}

[[test]]
args = [
    "--/renderer/enabled=pxr",
    "--/renderer/active=pxr",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window"
]
dependencies = [
    "omni.graph.action_nodes",
    "omni.graph.nodes",
    "omni.graph.test",
    "omni.graph.ui_nodes",
    "omni.hydra.pxr",
    "omni.kit.test_suite.helpers",
    "omni.kit.ui_test",
    "omni.kit.viewport.window",
    "omni.graph.window.generic",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/Pixel_perfect-LICENSE.md",
    "docs/prettycons-LICENSE.md",
    "docs/CHANGELOG.md",
]
