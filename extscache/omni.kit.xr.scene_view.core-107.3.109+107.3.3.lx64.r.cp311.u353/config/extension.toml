[package]
version = "107.3.109"
title = "XR Draw System for Scene UI"
description = "Uses USD primitives to display UI Scene objects"
category = "UI"
icon = "data/icon.png"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
keywords = ["UI", "USD", "XR", "Opt out of nSpect"]

authors = ["NVIDIA"]

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]
"omni.kit.viewport.registry" = {}
"omni.kit.viewport.utility" = {}
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.usd" = {}
"usdrt.scenegraph" = {}
"omni.kit.xr.core" = { version = "=107.3.109" }
"omni.kit.xr.ui.window.viewport" = { version = "=107.3.109" }
"omni.kit.xr.system.simulatedxr" = { version = "=107.3.109", optional = true }

[settings]
exts."omni.ui.scene".widget.multiGPU.pooled = true

[[native.library]]
path = "bin/${lib_prefix}omni.kit.xr.scene_view.core${lib_ext}"

[[python.module]]
name = "omni.kit.xr.scene_view.core"

[[test]]
pythonTests.include = ["omni.kit.xr.scene_view.core.tests.*"]
# test_extensions_api_md_is_uptodate is introduced by Kit SDK 106.5.0-master.155047.4ca82eb9
# exclude it to make it undiscoverable by CI
pythonTests.exclude = ["*test_extensions_api_md_is_uptodate"]

args = [
    "--/app/content/emptyStageOnStart=0",
    "--/app/docks/disabled=true",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/testMode=1",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/hideUi=true",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/width=512",
    "--/app/window/height=512",

    "--/exts/omni.kit.renderer.core/present/enabled=false",

    "--/omni.kit.plugin/syncUsdLoads=true",

    "--/persistent=0",
    "--/persistent/app/viewport/displayOptions=0",
    "--/persistent/app/primCreation/PrimCreationWithDefaultXformOps=true",

    "--/renderer/multiGpu/enabled=true",
    "--/renderer/multiGpu/autoEnable=true",

    "--reset-user",

    "--/rtx/hydra/materialSyncLoads=true",
    "--/rtx/hydra/perMaterialSyncLoads=true",
    "--/rtx/materialDb/syncLoads=true",
    "--/rtx/post/aa/op=0",
    "--/rtx/sceneDb/ambientLightIntensity=1.0",
    "--/rtx-transient/dlssg/enabled=false",

    "--/xr/debug=true",
    "--/xr/persistence/enabled=false",
    "--/log/channels/omni.usd=error",
    "--/app/useFabricSceneDelegate=true",
]


dependencies = [
    "omni.kit.primitive.mesh",
    "omni.kit.mainwindow",
    "omni.kit.xr.system.simulatedxr",
    "omni.kit.test_helpers_gfx",
]

timeout = 3600

stdoutFailPatterns.include = [
    "*leak*", # We need to not leak any textures
]

[documentation]
python_api_hidden = true
