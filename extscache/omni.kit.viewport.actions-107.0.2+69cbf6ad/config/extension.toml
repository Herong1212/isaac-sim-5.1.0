[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.2"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Viewport Actions and Hotkeys"
description="General Viewport Actions and Hotkeys"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "viewport", "camera", "actions", "hotkeys"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Internal"
support_level = "Core"

[dependencies]
"omni.activity.core" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.viewport.window" = {}
"omni.kit.actions.core" = {}
"omni.kit.hotkeys.core" = { optional = true }
"omni.usd" = {}
"usdrt.scenegraph" = { optional = true}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.actions".
[[python.module]]
name = "omni.kit.viewport.actions"

[settings]
# The scene-level sticky display options that should be reset to on when a new stage is opened
exts."omni.kit.viewport.actions".resetVisibilityOnOpen = []
# Whether visibility toggling ignores objects hidden in the stage-view UI
exts."omni.kit.viewport.actions".visibilityToggle.ignoreStageWindowHidden = false
# Setting that controls what toggle_global_visibility hides
exts."omni.kit.viewport.actions".visibilityToggle.globalTypes = [
    "guide/grid",
    "scene/cameras", "scene/lights", "scene/skeletons",
    # "scene/audio"
]
# Setting to control whether camera visibility removes the child-camera mesh or toggles the parent camera visibility
exts."omni.kit.viewport.actions".visibilityToggle.removeCameraMeshes = true
# Setting that controls what HUD items toggle_global_visibility and toggle_hud_visibility hides
exts."omni.kit.viewport.actions".visibilityToggle.hudTypes = [
    "hud/renderFPS", "hud/deviceMemory", "hud/hostMemory", "hud/renderProgress", "hud/renderResolution",
    # "hud/cameraSpeed"
]

[[test]]
pythonTests.exclude = [
    "omni.kit.viewport.actions.tests.test_actions*"
]
dependencies = [
]
args = [
    "--/renderer/enabled=pxr",
]


[[test]]
name = "viewport"
pythonTests.include = [
    "omni.kit.viewport.actions.tests.test_actions*"
]
dependencies = [
    "omni.kit.hotkeys.core",
    "omni.kit.ui_test",
]

# Run tests with optional UsdRt
[[test]]
name = "usdrt.scenegraph"
pythonTests.include = [
    "omni.kit.viewport.actions.tests.test_actions*"
]
dependencies = [
    "omni.kit.hotkeys.core",
    "omni.kit.ui_test",
    "usdrt.scenegraph",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/SETTINGS.md",
    "docs/USAGE_PYTHON.md",
]
