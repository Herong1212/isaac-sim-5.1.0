[package]
title = "Graph Editor Core"
description = "Common framework for Graph Editors in Kit"
version = "1.5.3"
authors = ["NVIDIA"]
repository = ""
keywords = ["graph", "editor", "nodes"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
readme = "docs/README.md"
category = "Graph"
icon = "icons/icon.svg"

[dependencies]
"omni.kit.graph.delegate.default" = {}
"omni.kit.widget.graph" = {}
"omni.kit.widget.searchfield" = {}
"omni.ui" = {}

[[python.module]]
name = "omni.kit.graph.editor.core"

[[test]]
dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.renderer.capture",
    "omni.kit.renderer.core",
]

args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window"
]
