[package]
version = "107.3.4"
title = "AnimGraph Core (BETA)"
authors = ["NVIDIA"]
keywords = ["animation", "animgraph", "anim", "graph", "skeleton", "skeletal"]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
description = "Animation graph system for blending animations with stage machines and nodes."
category = "Animation"
preview_image = "data/preview.png"
icon = "data/icon.png"

[[python.module]]
name = "omni.anim.graph.core"

[fswatcher.patterns]
include = ["*.ogn", "*.py"]
exclude = ["Ogn*Database.py"]

[dependencies]
"omni.debugdraw" = {}
"omni.client" = {}
"omni.kit.commands" = {}
"omni.kit.hotkeys.core" = {}
"omni.kit.usd_undo" = {}
"omni.kit.widget.stage" = {}
"omni.graph" = {}
"omni.graph.core" = {}
"omni.graph.tools" = {}
"omni.graph.nodes" = {}
"usdrt.scenegraph" = {}
"omni.usd" = {}
"omni.kit.async_engine" = {}
"omni.kit.pip_archive" = {}
"omni.usd.schema.anim" = {}
"omni.anim.graph.schema" = { version="~107.3" }
"omni.anim.asset" = { version="~107.3" }
"omni.anim.retarget.core" = { version="~107.3" }


[[native.plugin]]
path = "bin/*.plugin"
recursive = false

[[test]]
timeout = 12000
dependencies = [
    "omni.kit.property.usd",
    "omni.graph.action",
    "omni.kit.viewport.window",
    "omni.kit.test_suite.helpers",
    "omni.hydra.rtx",
]
args = [
    "--/exts/omni.kit.viewport.window/startup/windowName=Viewport",
    "--/renderer/enabled=rtx",
    "--/renderer/active=rtx",
    "--/app/asyncRendering=false",
    "--/app/docks/disabled=true",
    "--/app/viewport/forceHideFps=true",
    "--/app/window/hideUi=true",
    "--/app/window/width=800",
    "--/app/window/height=600",
    "--/app/renderer/resolution/width=800",
    "--/app/renderer/resolution/height=600",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window"
]
stdoutFailPatterns.exclude = [
    "*Typeinfo for tag (appliedSchema) not found. Please add it using addType()*",
]

[package.writeTarget]
kit = true
usd = true

[settings]
exts."omni.anim.graph.core".use_usdrt = true
exts."omni.kit.test".includeTests = [
    "omni.anim.graph.core."
]
