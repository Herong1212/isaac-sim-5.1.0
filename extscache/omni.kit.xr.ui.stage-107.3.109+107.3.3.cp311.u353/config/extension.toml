[package]
version = "107.3.109"
title = "XR UI for common stage ui elements"
description = "This extension the common ui widgets for the stage"
readme = "docs/README.md"
category = "XR"
keywords = ["XR", "Opt out of nSpect"]
changelog = "docs/CHANGELOG.md"

authors = ["NVIDIA"]
icon = "data/icon/iconxr.png"
preview_image = "data/icon/preview.png"
repository = ""

[package.writeTarget]
kit = true
python = true
usd = true

[core]
reloadable = true

[dependencies]
"omni.kit.xr.scene_view.core" = { version = "=107.3.109" }
"omni.kit.xr.core" = { version = "=107.3.109" }
"omni.kit.xr.scene_view.utils" = { version = "=107.3.109" }
"omni.kit.xr.ui.window.viewport" = { version = "=107.3.109" }
"omni.kit.xr.ui.window.profile" = { version = "=107.3.109" }
"omni.kit.commands" = {}

"omni.kit.xr.system.simulatedxr" = { version = "=107.3.109", optional = true }

[[python.module]]
name = "omni.kit.xr.ui.stage"

[[python.module]]
name = "omni.kit.xr.ui.stage.tests"

[[test]]
pythonTests.include = ["omni.kit.xr.ui.stage.tests.*test_unit*"]

args = [
    "--/renderer/multiGpu/enabled=true",
    "--/app/window/width=800",
    "--/app/window/height=600",
    "--/app/renderer/resolution/width=800",
    "--/app/renderer/resolution/height=600",
    "--/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/testMode=1",
    "--/app/content/emptyStageOnStart=0",
    "--/persistent=0",
    "--/xr/persistence/enabled=false",
    "--reset-user",
    "--/xr/debug=true",
    "--/no-assert-dialog=true",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/materialDb/syncLoads=true",
    "--/rtx/hydra/perMaterialSyncLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/docks/disabled=true",
    "--/app/window/hideUi=true",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/exts/omni.kit.renderer.core/present/enabled=false",
    "--/rtx-transient/dlssg/enabled=false",
    "--/log/channels/omni.usd=error",
    "--/app/useFabricSceneDelegate=true",
]

timeout = 3600
retries = 1

stdoutFailPatterns.exclude = [
    "*Unable to find icon*",
    "*omni.kit.registry.nucleus.utils.common*Skipping deletion of*",
    "shaderGroupHandle changed for shader group*",
    "*IRAY*",
    "*SBT*",
    "*neuray*",
    "*Failed opening shader cache version file*",
    "*[omni.kit.viewport.menubar.camera.camera_menu_container]*",
    "*OpenXR-Loader*",
    "*[carb.imgui.plugin] Unable to load IWindowing!*",
    "*Refconting underflow*",
]

dependencies = [
   "omni.kit.xr.system.simulatedxr",
]

[documentation]
python_api_hidden = true
