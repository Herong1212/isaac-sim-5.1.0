[package]
version = "107.3.3"
title = "AnimGraph Bundle (BETA)"
authors = ["NVIDIA"]
keywords = ["animation", "animgraph", "anim", "graph", "skeleton", "skeletal"]
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
description = "Bundle for AnimGraph extensions"
category = "Animation"
preview_image = "data/preview.png"
icon = "data/icon.png"

[[python.module]]
name = "omni.anim.graph.bundle"

[dependencies]
"omni.anim.graph.schema" = { version="~107.3" }
"omni.anim.graph.core" = { version="~107.3" }
"omni.anim.graph.ui" = { version="~107.3" }

[package.writeTarget]
kit = true

[[test]]
waiver = "Bundle extension"

stdoutFailPatterns.exclude = [
    "*could not acquire omni::graph::core::IGraphRegistry*",
    "*Folder*does not exist!*",
]
