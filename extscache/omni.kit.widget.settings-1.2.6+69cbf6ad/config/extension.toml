[package]
title = "Settings Widget"
description = "Settings Widget"
version = "1.2.6"
category = "Internal"
authors = ["NVIDIA"]

repository = ""
keywords = ["settings", "ui"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
support_level = "Core"

# Preview image. Folder named "data" automatically goes in git lfs (see .gitattributes file).
preview_image = "data/preview.png"

[dependencies]
"omni.ui" = {}
"omni.kit.commands" = {}
"omni.kit.widget.searchable_combobox" = { optional=true }

[[python.module]]
name = "omni.kit.widget.settings"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/Settings.md",
    "docs/CHANGELOG.md",
]


[[test]]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

dependencies = [
    "omni.kit.ui_test",
    "omni.kit.window.preferences",
    "omni.rtx.window.settings",
]
