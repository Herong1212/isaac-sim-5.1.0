[package]
# Semantic Versioning is used: https://semver.org/
version = "2.0.1"

category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "Common Menu"
description="Implementation of parts of Window and Help menus."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "menu"]
support_level = "Sample"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"

# Preview image. Folder named "data" automatically goes in git lfs (see .gitattributes file).
preview_image = "data/preview.png"

[dependencies]
"omni.kit.menu.utils" = {}
"omni.kit.ui.actions" = {}

[[python.module]]
name = "omni.kit.menu.common"

[settings]
# Setting this to false because we also set F11 in this ext.
exts."omni.appwindow".listenF11 = false
exts."omni.kit.menu.common".kit_sdk_name = "Discover Kit SDK"
exts."omni.kit.menu.common".external_kit_sdk_url = "https://docs.omniverse.nvidia.com/kit/docs/kit-manual/latest/guide/kit_overview.html"
exts."omni.kit.menu.common".kit_manual_name = "Developers Guide"
exts."omni.kit.menu.common".external_kit_manual_url = "https://docs.omniverse.nvidia.com/dev-guide/latest/overview.html"
exts."omni.kit.menu.common".reference_guide_name = "OpenUSD Reference Guide"
exts."omni.kit.menu.common".external_reference_guide_url = "https://openusd.org/release/index.html"

[[test]]
args = [
    "--/app/file/ignoreUnsavedStage=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/window/showDpiScaleMenu=true",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.material.library",
    "omni.kit.hotkeys.core"
]

timeout = 900

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md"]
