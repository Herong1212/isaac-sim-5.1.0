[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.10"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Render settings in Viewport Menu Bar"
description="Adds a variety of render settings"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "ui", "menu", "viewport", "render"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

category = "Internal"
support_level = "Core"

[dependencies]
"omni.kit.viewport.menubar.core" = {}
"omni.kit.window.preferences" = {optional=true}
"omni.kit.hotkeys.core" = {optional=true}

# Main python module this extension provides, it will be publicly available as "import omni.kit.viewport.menubar.render".
[[python.module]]
name = "omni.kit.viewport.menubar.render"

[settings]
exts."omni.kit.viewport.menubar.render".visible = true
exts."omni.kit.viewport.menubar.render".order = -90
exts."omni.kit.viewport.menubar.render".shadingMode = "default"
exts."omni.kit.viewport.menubar.render".lightingMode = "default"
exts."omni.kit.viewport.menubar.render".materialMode = "default"
# Renderers to watch for extension load to add to menu
exts."omni.kit.viewport.menubar.render".autoManage.enabledList = "rtx,index,iray,pxr"
# Whether items can be removed from menu when extension is not loaded
exts."omni.kit.viewport.menubar.render".autoManage.canRemove = true

[settings.exts."omni.kit.viewport.menubar.render".presets]
draft="${omni.kit.viewport.menubar.render}/data/presets/draft.settings.usda"
medium="${omni.kit.viewport.menubar.render}/data/presets/medium.settings.usda"
final="${omni.kit.viewport.menubar.render}/data/presets/final.settings.usda"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/SETTINGS.md",
    "docs/USAGE_PYTHON.md",
]

[[test]]
pythonTests.exclude = [
    "omni.kit.viewport.menubar.render.tests.test_ui.*test_auto_manage_renderer_list*",
]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.window.file_exporter",
    "omni.kit.window.file_importer",
    "omni.rtx.window.settings",
]
args = [
    "--/app/window/width=600",
    "--/app/window/height=500",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

[[test]]
name = "auto_manage_renderer_list"
pythonTests.include = [
    "omni.kit.viewport.menubar.render.tests.test_ui.*test_auto_manage_renderer_list",
]
dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.window.file_exporter",
    "omni.kit.window.file_importer",
    "omni.rtx.window.settings",
]
args = [
    "--/app/window/width=600",
    "--/app/window/height=500",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]


[[test]]
name = "startup_list"
pythonTests.include = [
    "omni.kit.viewport.menubar.render.tests.test_ui.*test_auto_manage_renderer_list_startup",
]
dependencies = [
    "omni.hydra.pxr",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
]
args = [
    "--/renderer/enabled=rtx,pxr,iray",
    "--/app/window/width=600",
    "--/app/window/height=400",
    "--/persistent/app/viewport/displayOptions=0",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]
