[package]
version = "1.3.1"
title = "OmniGraph GPU Interop nodes"
description = "Provides the entry point nodes into pre and post render graphs."
authors = ["NVIDIA"]
category = "Graph"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
repository = ""
support_level = "Core"
keywords = ["omnigraph", "image", "prerender", "postrender", "nodes"]
preview_image = "data/preview.png"
icon = "data/icon.svg"

[dependencies]
"omni.graph.image.core" = {}
"omni.graph.tools" = {}
"omni.graph.core" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

[[test]]
# This can be removed if manual test scripts are ever added
waiver = "Automatically generated tests exist in this extension but are not recognized by the test verification"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
