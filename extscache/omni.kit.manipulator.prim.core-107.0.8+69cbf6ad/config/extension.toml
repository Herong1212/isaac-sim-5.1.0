[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.8"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
description = "Prim Manipulator Core Extension"
title = "Prim Manipulator Core"

# Path (relative to the root) or content of readme markdown file for UI.
readme = "docs/README.md"

# URL of the extension source repository.
repository = ""

# One of categories for UI.
category = "Scene"
support_level = "Core"

# Keywords for the extension
keywords = ["kit", "manipulator", "usd", "prim"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

[dependencies]
"omni.kit.context_menu" = {}
"omni.kit.manipulator.selector" = {}
"omni.kit.manipulator.tool.snap" = {}
"omni.kit.manipulator.transform" = {}
"omni.kit.viewport.manipulator.transform" = {}
"omni.kit.manipulator.viewport" = { optional = true }
"omni.kit.viewport.registry" = {}
"omni.kit.widget.toolbar" = { optional = true }
"omni.timeline" = {}
"omni.usd" = {}


# Main python module this extension provides, it will be publicly available as "import omni.example.hello".
[[python.module]]
name = "omni.kit.manipulator.prim.core"

[settings]
exts."omni.kit.manipulator.prim.core".tools.enabled = true
exts."omni.kit.manipulator.prim.core".visual.delayFrame = 0  # default to 0 to turn this experimental off. 3 is a resonable number for rtx
persistent.exts."omni.kit.manipulator.prim.core".manipulator.placement = "Authored Pivot"
persistent.exts."omni.kit.manipulator.selector".orders."omni.kit.manipulator.prim.core" = -1
# exts."omni.kit.manipulator.prim.core".supportfabric = true

[[test]]
name = "USD accessor"
timeout = 1200
samplingFactor = 0.2  # run 20% of tests, after ~5 runs (1/0.2) all tests will have completed

dependencies = [
  "omni.kit.ui_test",
  "omni.kit.window.toolbar", # Use a better diff metric than pure UI test for RTX renderered pixels
  "omni.kit.test_helpers_gfx",
  "omni.hydra.rtx",
  "omni.kit.viewport.window",
  "omni.kit.manipulator.prim.usd",
  "omni.kit.manipulator.prim.fabric", #We enable fabric accessor even for USD only accessor test, see https://jirasw.nvidia.com/browse/OM-122856
]

args = [
  "--/renderer/enabled=rtx",
  "--/renderer/active=rtx",
  "--/renderer/multiGpu/enabled=false",
  "--/renderer/multiGpu/autoEnable=false",
  "--/app/asyncRendering=false",
  "--/rtx/post/aa/op=0",
  "--/rtx/reflections/enabled=0",
  "--/app/window/dpiScaleOverride=1.0",
  "--/app/window/scaleToMonitor=false",
  "--/app/window/hideUi=true",
  "--/app/window/width=500",
  "--/app/window/height=500",
  "--/app/renderer/resolution/width=500",
  "--/app/renderer/resolution/height=500", # Legacy options the image tests depend on
  "--/app/useFabricSceneDelegate=false", #We disable FSD flag explicetely for USD only accessor test, see https://jirasw.nvidia.com/browse/OM-122856
  "--/persistent/app/viewport/displayOptions=0",
  "--/persistent/app/viewport/outline/width=0",
  "--/app/viewport/outline/enabled=false",
  "--/persistent/app/viewport/gizmo/constantScaleEnabled=true",
  "--/persistent/app/viewport/gizmo/constantScale=10.0",
  "--/persistent/app/viewport/gizmo/maxFadeOut=1.0",
  "--/persistent/app/viewport/gizmo/maxFadeOut=50.0",
  "--/persistent/exts/omni.kit.manipulator.transform/manipulator/scaleMultiplier=1.4",
  "--/exts/omni.kit.manipulator.prim.core/tools/enabled=false",
  "--/exts/omni.kit.manipulator.prim.core/visual/delayFrame=0",
  "--reset-user",
]

pyCoverageOmit = [
  "*/tests/*",
  "omni/kit/manipulator/prim/pivot_button_group.py"  # can't be tested within Kit repo since it's only used when omni.explore.toolbar presents
]

pythonTests.unreliable = [
    "*test_toolbar", # OM-75240
    "*test_remove_xform_op_order_pivot*", # OM-111406
    "*test_snap_orient*",
]

[[test]]
name = "Fabric accessor"
pythonTests.exclude = [
  "*_local_*",
  "*test_unknown_move_mode*",
  "*test_placement", # OMPE-23142
]
timeout = 1200
samplingFactor = 0.2  # run 20% of tests, after ~5 runs (1/0.2) all tests will have completed

dependencies = [
  "omni.kit.ui_test",
  "omni.kit.window.toolbar", # Use a better diff metric than pure UI test for RTX renderered pixels
  "omni.kit.test_helpers_gfx",
  "omni.hydra.rtx",
  "omni.kit.viewport.window",
  "omni.kit.manipulator.prim.usd",
  "omni.kit.manipulator.prim.fabric",
]

args = [
  "--/renderer/enabled=rtx",
  "--/renderer/active=rtx",
  "--/renderer/multiGpu/enabled=false",
  "--/renderer/multiGpu/autoEnable=false",
  "--/app/asyncRendering=false",
  "--/rtx/post/aa/op=0",
  "--/rtx/reflections/enabled=0",
  "--/app/window/dpiScaleOverride=1.0",
  "--/app/window/scaleToMonitor=false",
  "--/app/window/hideUi=true",
  "--/app/window/width=500",
  "--/app/window/height=500",
  "--/app/renderer/resolution/width=500",
  "--/app/renderer/resolution/height=500", # Legacy options the image tests depend on
  "--/app/useFabricSceneDelegate=true",
  "--/persistent/app/viewport/displayOptions=0",
  "--/persistent/app/viewport/outline/width=0",
  "--/app/viewport/outline/enabled=false",
  "--/persistent/app/viewport/gizmo/constantScaleEnabled=true",
  "--/persistent/app/viewport/gizmo/constantScale=10.0",
  "--/persistent/app/viewport/gizmo/maxFadeOut=1.0",
  "--/persistent/app/viewport/gizmo/maxFadeOut=50.0",
  "--/persistent/exts/omni.kit.manipulator.transform/manipulator/scaleMultiplier=1.4",
  "--/exts/omni.kit.manipulator.prim.core/tools/enabled=false",
  "--/exts/omni.kit.manipulator.prim.core/visual/delayFrame=0",
  "--reset-user",
]

pyCoverageOmit = [
  "*/tests/*",
  "omni/kit/manipulator/prim/pivot_button_group.py"  # can't be tested within Kit repo since it's only used when omni.explore.toolbar presents
]

pythonTests.unreliable = [
    "*test_toolbar", # OM-75240
    "*test_remove_xform_op_order_pivot*", # OM-111406
    "*test_snap_orient*",
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md", "docs/USAGE_PYTHON.md"]
