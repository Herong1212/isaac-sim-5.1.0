[package]
version = "7.0.0"
title = "Livestream WebRTC Backend"
description = "Enable streaming capabilities, making the application useable remotely."
readme = "docs/README.md"
repository = ""
category = "Rendering"
keywords = ["streaming", "server"]
changelog = "docs/CHANGELOG.md"
icon = "data/icon.png"
preview_image = "data/preview.png"
authors = ["NVIDIA"]

# Only available to the Kit version it was built with (and higher)
[package.writeTarget]
kit = true

[[python.module]]
name = "omni.kit.livestream.webrtc"

[dependencies]
"omni.kit.livestream.core" = {}
"omni.kit.streamsdk.plugins" = {}

[[native.plugin]]
path = "${omni.kit.streamsdk.plugins}/bin/carb.livestream-rtc.plugin"

[settings]
app.livestream.port = 49100
app.livestream.proto = "websocket"
app.livestream.ipversion = "ipv4"

[[test]]
parallelizable = false
"filter:platform"."linux-x86_64".enabled = false
waiver = "Validation of end-to-end workflow covered via the productized, User-facing omni.kit.livestream.webrtc extension." # OM-48092
