[package]
title = "OmniGraph Image Core"
version = "0.6.1"
category = "Graph"
readme = "docs/README.md"
changelog = "docs/CHANGELOG.md"
description = "Provides the runtime execution framework for OmniGraphs evaluated during the pre and post render stages."
repository = ""
support_level = "Core"
keywords = ["omnigraph", "image", "postrender", "core"]

# Other extensions on which this one relies
[dependencies]
"omni.gpucompute.plugins" = {}
"omni.kit.exec.core" = {}
"omni.graph.core" = {}
"omni.graph.exec" = {}

[[native.plugin]]
path = "bin/*.plugin"
recursive = false

[[test]]
cppTests.libraries = [
    "bin/${lib_prefix}omni.graph.image.core.tests${lib_ext}",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
cpp_api = [
    "../../../include/omni/graph/image/unstable/ComputeParamsBuilder.h",

    "../../../include/omni/graph/image/unstable/IPreRenderGraph.h",
    "../../../include/omni/graph/image/unstable/IPreRenderGraph.gen.h",
    "../../../include/omni/graph/image/unstable/IPostRenderGraph.h",
    "../../../include/omni/graph/image/unstable/IPostRenderGraph.gen.h",
]
cpp_api_exclude_warnings = [
    ".*warning:.* is not documented",
    "warning: Internal inconsistency",
]
