[package]
title = "USDZ Exporter"
description = "Packages assets into a USDZ archive."
authors = ["NVIDIA"]
version = "1.0.9"
changelog="docs/CHANGELOG.md"
preview_image = "data/preview.png"
readme  = "docs/README.md"
category = "Tools"
support_level = "Sample"
feature = true

[[python.module]]
name = "omni.kit.usdz_export"

[dependencies]
"omni.kit.pip_archive" = {}
"omni.ui" = {}
"omni.usd" = {}
"omni.usd.libs" = {}
"omni.kit.usd.collect" = {}
"omni.kit.window.file_exporter" = {}
"omni.kit.notification_manager" = {}
"omni.kit.widget.prompt" = {}

[[test]]
args = [
    "--/app/asyncRendering=false",
    "--/rtx/materialDb/syncLoads=true",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
]

dependencies = [
    "omni.kit.context_menu",
    "omni.kit.material.library",
    "omni.kit.widget.layers",
    "omni.kit.ui_test"
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/USAGE_PYTHON.md"]