[package]

# Semantic Versioning is used: https://semver.org/
version = "2.0.7"
category = "Internal"
preview_image = "data/preview.png"
readme = "docs/README.md"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Material Library"
description="Material Utility Functions"

# URL of the extension source repository.
repository = ""
support_level = "Core"
feature = true

# Keywords for the extension
keywords = ["kit", "material", "library"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

[documentation]
pages = [
    "docs/Overview.md",
    "docs/Settings.md",
    "docs/CHANGELOG.md",
]

[dependencies]
"omni.usd" = {}
"omni.kit.commands" = {}
"omni.kit.context_menu" = {optional = true}
"omni.kit.menu.utils" = {optional = true}
"omni.kit.notification_manager" = {optional = true}
"omni.kit.window.file_importer" = {optional = true}
"omni.kit.usd.layers" = {}
"omni.mdl.neuraylib" = {}
"omni.mdl" = {}
"omni.materialx.libs" = {}
"omni.kit.actions.core" = {}
"omni.client" = {}
"omni.ui" = {}

[[python.module]]
name = "omni.kit.material.library"

[settings]
# deprecated
exts."omni.kit.material.library".original_svg_color = false
# material paths to build UI list from. Can be amended with omni.kit.material.library.add_to_mtl_lib / remove_from_mtl_lib functions.
exts."omni.kit.material.library".lib_paths = [ "${kit}/mdl/core/Base", "${kit}/mdl/core/Volume"]
# materials to not add to UI list.
exts."omni.kit.material.library".ui_hidden_list = [
    "${kit}/mdl/core/Base/OmniPBR_Opacity.mdl",
    "${kit}/mdl/core/Base/OmniPBR_ClearCoat_Opacity.mdl",
    "${kit}/mdl/core/Base/OmniGlass_Opacity.mdl",
    "${kit}/mdl/core/Base/SimPBR_Model.mdl",
]
# "ui_show_list" when set, the UI "Create" material menus will only list materials listed. EG. ["OmniPBR*", "OmniSurface*"]
# NOTE: This uses fnmatch, so wild-cards can be used.
exts."omni.kit.material.library".ui_show_list = []
# show/hide material groups in "Create" material menus.
exts."omni.kit.material.library".show_ui_groups = true
# material cache, avoids loading all materials from lib_paths every launch.
exts."omni.kit.material.library".cache_mdl = true
exts."omni.kit.material.library".cache_version = "1.5"
# default strength.
persistent.app.stage.materialStrength = "weakerThanDescendants"

[[test]]
# NOTE: test_material test hangs with hdStorm
args = [
    "--/renderer/multiGpu/enabled=false",
    "--/rtx/materialDb/syncLoads=true",
    "--/omni.kit.plugin/syncUsdLoads=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/renderer/waitIdle=true",
    "--/app/hydraEngine/waitIdle=true",
    "--/app/asyncRendering=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/persistent/app/stage/dragDropImport='reference'",
    "--/persistent/app/material/dragDropMaterialPath='absolute'",
    "--/persistent/app/properties/material/displayBaseShader=true",
    "--/persistent/app/hydra/material/renderContext='mdl'",
    "--/persistent/app/viewport/pickingMode='kind:model.ALL'",
    "--/persistent/app/usd/muteUsdCodingError=true",
    "--/omni.kit.plugin/usdMuteDiagnosticMessage=true",
    "--/exts/omni.kit.notification_manager/disable_notifications=true",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.widget.stage",
    "omni.kit.window.content_browser",
    "omni.kit.property.material",
    "omni.kit.window.stage",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.hydra.rtx",
    "omni.kit.viewport.utility",
    "omni.kit.viewport.window",
    "omni.kit.window.file_importer",
    "omni.kit.window.preferences",
    "omni.kit.context_menu",
    "omni.kit.menu.utils",
    "omni.kit.notification_manager",
]

stdoutFailPatterns.exclude = [
    "*Failed to acquire interface [omni::kit::renderer::IGpuFoundation v0.2] while unloading all plugins*",
    "*DeprecationWarning: There is no current event loop*", # It only happens when running a script with --exec for some reason. And it was changed recently in cpython 3.10: https://github.com/python/cpython/commit/300d812fd1c4d9244e71de0d228cc72439d312a7
    "*References an asset that can not be found:*",
    "*Slang compilation diagnostic*",
    "*[MDLC:COMPILER]   1.0   MDLC   comp error*",
]

timeout = 800
