[package]
# Semantic Versioning is used: https://semver.org/
version = "2.0.5"

category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "USD File UI"
description = "Provides utility functions to new/open/save/close USD files"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "usd", "ui"]
support_level = "Core"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"

[dependencies]
"omni.client" = {}
"omni.usd" = {}
"omni.kit.stage_template.core" = { optional = true }
"omni.ui" = {}
"omni.kit.pip_archive" = {}              # Pull in pip_archive to make sure psutil is found and not installed
"omni.kit.helper.file_utils" = {}
"omni.kit.window.file_importer" = {}
"omni.kit.window.file_exporter" = {}
"omni.kit.widget.versioning" = { optional = true }
"omni.kit.widget.nucleus_connector" = {}
"omni.kit.actions.core" = {}

[[python.module]]
name = "omni.kit.window.file"

[settings]
exts."omni.kit.window.file".enable_versioning = true

[[test]]
args = [
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/exts/omni.kit.test/testExtRandomOrder=true",
    "--/exts/omni.kit.test/testExtRetryStrategy='iterations'",
    "--/exts/omni.kit.test/testExtMaxTestRunCount=1",
]

dependencies = [
    "omni.kit.mainwindow",
    "omni.kit.menu.file",
    "omni.kit.material.library",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.viewport.window",
    "omni.kit.widget.versioning",
]

# The errors result in flaky test failures approximately 1 out of every 100 runs.
stdoutFailPatterns.exclude = [
    "*Stage opening or closing already in progress*",
    "*Task exception was never retrieved*",
    "*wait_for_stage_event timeout waiting for StageEventType.SAVED*",
    ]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/Settings.md",
]
