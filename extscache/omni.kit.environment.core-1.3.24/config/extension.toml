[package]
# Semantic Versionning is used: https://semver.org/
version = "1.3.24"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Environment Core"
description="Environment APIs, widgets, player and pereference."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ['core', 'environment', 'API', 'pereference']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Rendering"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.svg"
feature = true

[dependencies]
"omni.kit.window.preferences" = {}
"omni.kit.widget.sliderbar" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.usd.layers" = {}
"omni.kit.actions.core" = {optional=true}
"omni.rtx.window.settings" = {optional=true}  # reqruied for command RestoreDefaultRenderSettingSectionCommand
"omni.kit.notification_manager" = {}
"omni.kit.window.filepicker" = {optional=true}

# Main python module this extension provides, it will be publicly available as "import omni.kit.window.material".
[[python.module]]
name = "omni.kit.environment.core"

[settings]
exts."omni.kit.environment.core".rtx.env.auto = false
exts."omni.kit.environment.core".rtx.env.defaultUrl = "http://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Skies/Dynamic/ClearSky.usd"
exts."omni.kit.environment.core".rtx.ground.enable = false
exts."omni.kit.environment.core".rtx.ground.material = "${omni.kit.environment.core}/data/Ground.mdl"
exts."omni.kit.environment.core".rtx.ground.subId = ""
exts."omni.kit.environment.core".extraMdlParam = false
exts."omni.kit.environment.core".ground.path = ""
exts."omni.kit.environment.core".rtx.light.warning = true

app.sunstudy.playing = false
app.sunstudy.enable = true
app.sunstudy.rate = 1
app.sunstudy.loop = false
app.sunstudy.currentSkyPath = ""
app.sunstudy.currentSkyType = ""

[[test]]
dependencies = [
    "omni.hydra.pxr",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.material.library",
    "omni.kit.window.filepicker",
]
args = [
    "--/renderer/enabled=pxr",               # required for scene template with render settings
    "--/renderer/active=pxr",                # required for scene template with render settings
    "--/app/asyncRendering=false",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/fastShutdown=true",
    "--reset-user",
    "--/persistent/app/viewport/displayOptions=0",
]

stdoutFailPatterns.exclude = [
    "*Failed to acquire interface [omni::kit::renderer::IGpuFoundation v0.2]*", # Leak
    "*Leak detected when releasing memory allocator Foundation Resource Allocator*", # OM-77580: Linux test failure
    "*Error when releasing memory pool Foundation Resource Allocator memory pool*", # OM-77580: Linux test failure
    "*[Error] [gpu.foundation.plugin] Failed to read*", # OMPE-55809: Linux test failure with new driver
    "*[Error] [rtx.scenedb.plugin] Failed to upload*", # OMPE-55809: Linux test failure with new driver
]

[[test]]
name = "rtx"
pythonTests.include = [
    "omni.kit.environment.core.tests.test_scene_template.TestSceneTemplate.test_apply_with_render_settings",
]
dependencies = [
    "omni.hydra.rtx",
    "omni.kit.viewport.window",
    "omni.kit.ui_test",
    "omni.kit.material.library",
    "omni.kit.window.filepicker",
]
args = [
    "--/renderer/enabled=rtx",               # required for scene template with render settings
    "--/renderer/active=rtx",                # required for scene template with render settings
    "--/app/asyncRendering=false",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/fastShutdown=true",
    "--reset-user",
]

[documentation]
pages = ["docs/Overview.md", "docs/SETTINGS.md", "docs/USAGE_PYTHON.md", "docs/CHANGELOG.md"]
