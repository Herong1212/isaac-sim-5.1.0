[package]
title = "Path Field Widget"
version = "2.0.11"
category = "Internal"
description = "String field widget with tooltips for branching"
authors = ["NVIDIA"]
slackids = ["UQY4RMR3N"]
repository = ""
keywords = ["kit", "ui"]
changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"
preview_image = "data/preview.png"
support_level = "Core"

[dependencies]
"omni.ui" = {}

[[python.module]]
name = "omni.kit.widget.path_field"

[[test]]
dependencies = [
    "omni.kit.ui_test",
]
args = [
   "--/app/window/dpiScaleOverride=1.0",
   "--/app/window/scaleToMonitor=false",
]

[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md", "docs/SETTINGS.md", "docs/USAGE_PYTHON.md"]
