[package]
# Semantic Versionning is used: https://semver.org/

version = "1.10.9"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Browser Folder APIs"
description="omni kit browser folder model and widget extension."

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ['browser', 'folder', 'API']

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

category = "Rendering"
readme  = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.browser.core" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.widget.nucleus_connector" = {}

# Main python module this extension provides, it will be publicly available as "import omni.browser.folder.core".
[[python.module]]
name = "omni.kit.browser.folder.core"

[settings]

[[test]]
dependencies = [
    "omni.kit.browser.sample",
    "omni.kit.ui_test",
]

args = [
    "--no-window",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
]

stdoutFailPatterns.exclude = [
    "*unload wait time exceeded limit of*", # ETM test failure with kit 105.0.1 integ-master
]


[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]
