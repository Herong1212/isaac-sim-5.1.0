[package]
title = "DGN Converter GUI Extension"
version = "509.1.0"
description = "DGN Converter Core Extension using Open Design Alliance (ODA) SDK"
category = "Converter"
repository = ""

changelog = "docs/CHANGELOG.md"
readme = "docs/Overview.md"

preview_image = "data/preview.png"
icon = "data/icon.png"

authors = ["NVIDIA"]

keywords = [
    'CAD Converter',
    'cad',
    'DGN'
]

writeTarget.kit = true
writeTarget.usd = true

[dependencies]
"omni.client" = {}
"omni.kit.tool.asset_importer" = {}
"omni.kit.converter.dgn_core" = { version = "~510.1" }
"omni.kit.converter.common" = { version = "~507.1" }

[[python.module]]
name = "omni.kit.converter.dgn"

# Extension test settings
[[test]]
args = [
    "--/app/file/ignoreUnsavedOnExit=true",
    "--no-window",
    "--/app/fastShutdown=true",
]
dependencies = [
    "omni.kit.ui_test",
]
stdoutFailPatterns.include = []
stdoutFailPatterns.exclude = [
    "*is not writeable*",
    "*`startup()` must succeed prior calling*",
    "*All of the following settings must be specified*",
    "*[omni.connect.core] Invalid host name - [omniverse://]*",
]

pyCoverageThreshold = 80
pyCoverageFilter = ["omni.kit.converter.dgn"]
pyCoverageOmit = ["*/tests/*"]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/Usage.md",
    "docs/Third_Party_Notices.md"
]
