[package]
title = "Content Browser Window"
version = "3.1.3"
category = "Browsers"
feature = true
description = "A window for browsing Omniverse content."
authors = ["NVIDIA"]
slackids = ["UQY4RMR3N"]
repository = ""
keywords = ["kit", "ui"]
readme  = "docs/README.md"
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
support_level = "Core"

[dependencies]
"omni.ui" = {}
"omni.client" = {}
"omni.kit.clipboard" = {}
"omni.kit.helper.file_utils" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.widget.filebrowser" = {}
"omni.kit.window.popup_dialog" = {}
"omni.kit.widget.versioning" = { optional=true }
"omni.kit.widget.search_delegate" = { optional=true }
"omni.kit.window.file_exporter" = {}
"omni.kit.window.file" = { optional=true }
"omni.kit.pip_archive" = {}
"omni.kit.window.drop_support" = {}
"omni.usd" = { optional=true }
"omni.kit.menu.utils" = {}
"omni.kit.window.content_browser_registry" = {}
"omni.kit.widget.filter" = {}
"omni.kit.actions.core" = { optional=true }
"omni.kit.hotkeys.core" = { optional=true }

[[python.module]]
name = "omni.kit.window.content_browser"

[[python.scriptFolder]]
path = "scripts"

[settings]
exts."omni.kit.window.content_browser".timeout = 10.0   # DEPRECATED
# OM-67058: default to list view in content browser
exts."omni.kit.window.content_browser".show_grid_view = false
exts."omni.kit.window.content_browser".enable_checkpoints = true
exts."omni.kit.window.content_browser".enable_timestamp = false
exts."omni.kit.window.content_browser".show_only_collections = ["bookmarks", "omniverse", "my-computer"]
# Uncomment and modify the following setting to add default server connections
# exts."omni.kit.window.content_browser".mounted_servers = {"my-server" = "omniverse://my-server", "another-server" = "omniverse://another-server"}
exts."omni.kit.window.content_browser".show_download_menuitem = true

[[test]]
args = [
    "--/renderer/enabled=pxr",
    "--/renderer/active=pxr",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/asyncRendering=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/persistent/app/omniverse/filepicker/options_menu/show_details=false",
    "--/persistent/app/stage/dragDropImport='reference'",
]

dependencies = [
    "omni.kit.viewport.window",
    "omni.kit.window.stage",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.widget.search_delegate",
    "omni.kit.widget.versioning",
    "omni.usd"
]

#pythonTests.unreliable = [
#    "*test_drag_drop_multiple_items", # OM-96308
#    "*test_drag_drop_single_item", # OM-96308
#    "*test_select_multiple_items", # OM-96308
#    "*test_select_single_item", # OM-96308
#]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
    "docs/SETTINGS.md",
    "docs/USAGE_PYTHON.md",
]
