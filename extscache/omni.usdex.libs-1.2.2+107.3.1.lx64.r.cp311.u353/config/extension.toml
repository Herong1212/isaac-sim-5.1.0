[package]
# Semantic Versionning is used: https://semver.org/
version = "1.2.2"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "OpenUSD Exchange Libraries"
description="Vendors the OpenUSD Exchange Libraries so they are easily accessible in Kit."

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/Overview.md"

category = "Internal"

# Keywords for the extension
keywords = [
    "OpenUSD",
    'USDEX',
    'Exchange',
    "SDK",
]
support_level = "Core"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

# Locks extension to the Kit and USD versions being used or higher
writeTarget.kit = true
writeTarget.usd = true

[dependencies]
"omni.usd.libs" = {}

[[native.library]]
path = "bin/${lib_prefix}omni_transcoding${lib_ext}"

# USD Exchange Core
[[native.library]]
path = "bin/${lib_prefix}usdex_core${lib_ext}"

# USD Exchange RTX
[[native.library]]
path = "bin/${lib_prefix}usdex_rtx${lib_ext}"

[[python.module]]
name = "omni.usdex.libs"

[[python.module]]
name = "usdex.core"

[[python.module]]
name = "usdex.rtx"

[[test]]
dependencies = [
    "omni.usd"
]
pythonTests.include = [
    "omni.usdex.libs.tests.test_usdex.*",
]

[documentation]
pages = [
    "docs/Overview.md",
    "docs/CHANGELOG.md",
]