[package]
# Semantic Versioning is used: https://semver.org/
version = "107.0.1"

# Which category this extension belongs to
category="Animation"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Stage Recorder UI (BETA)"
description="For recording animations and simulations in Omniverse"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["animation", "asset", "recorder", "simrecorder", "stagerecorder", "ui"]

# Preview image. Folder named "data" automatically goes in git lfs (see .gitattributes file).
preview_image = "data/preview.png"
icon = "data/recorder.png"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"
readme = "docs/README.md"

[[python.module]]
name = "omni.kit.stagerecorder.ui"

[dependencies]
"omni.usd" = {}
"omni.ui" = {}
"omni.kit.stagerecorder.core" = {}
"omni.kit.widget.layers" = {}
"omni.kit.widget.filebrowser" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.window.content_browser" = {}
"omni.kit.widget.prompt" = {}
"omni.kit.widget.stage" = {}
"omni.kit.context_menu" = {optional=true}

[[test]]
timeout = 600
args = [
    "--/renderer/enabled=pxr",
    "--/renderer/active=pxr",
    "--/renderer/multiGpu/enabled=false",
    "--/renderer/multiGpu/autoEnable=false", # Disable mGPU with PXR due to OM-51026, OM-53611
    "--/renderer/multiGpu/maxGpuCount=1",
    "--/app/asyncRendering=false",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--no-window"
]

dependencies = [
    "omni.hydra.pxr",
    "omni.kit.mainwindow",
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers"
]

[package.writeTarget]
kit = true
