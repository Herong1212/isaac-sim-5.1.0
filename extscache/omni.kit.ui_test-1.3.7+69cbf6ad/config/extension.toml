[package]
# Semantic Versioning is used: https://semver.org/
version = "1.3.7"

category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarily for displaying extension info in UI
title = "UI Testing Helper functions"
description = "UI Testing Helper functions"

# URL of the extension source repository.
repository = ""

# Keywords for the extension
keywords = ["kit", "test"]
support_level = "Sample"

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog = "docs/CHANGELOG.md"

[dependencies]
"omni.ui" = {}
"omni.ui_query" = {}

[[python.module]]
name = "omni.kit.ui_test"


[settings]

# Extra delay in seconds between user imitated actions in UI testing (for UI test development / debugging)
exts."omni.kit.ui_test".humanDelay = 0.0

# Print all info logging of this extension to std out (for UI test development / debugging)
exts."omni.kit.ui_test".printInfoLog = false


[[test]]
dependencies = [
    "omni.kit.uiapp",
]
