[package]
version = "107.3.109"
title = "OpenXR Input/Output"
description="Component to communicate with OpenXR"
readme  = "docs/README.md"
category = "XR"
keywords = ["XR", "Extended Reality", "VR", "AR", "MR", "OpenXR", "Opt out of nSpect"]
changelog="docs/CHANGELOG.md"

authors = ["NVIDIA"]
icon = "data/icon/iconxr.png"
preview_image = "data/icon/preview.png"
repository = ""

[package.writeTarget]
kit = true
python = true
usd = true

[dependencies]
"omni.kit.xr.core" = { version = "=107.3.109" }

[[native.plugin]]
path = "bin/omni.ext-system.openxr.plugin"

[[python.module]]
name = "omni.kit.xr.system.openxr.tests"

[[python.module]]
name = "omni.kit.xr.system.openxr"
[settings]
# Enable some built-in components always
xr.openxr.components."omni.kit.xr.openxr.varjo.depth_occlusion".enabled = true

[[test]]
pythonTests.include = ["omni.kit.xr.system.openxr.tests.*test_unit*"]

args = [
    "--/renderer/multiGpu/enabled=true",
    "--/app/window/width=800",
    "--/app/window/height=600",
    "--/app/window/dpiScaleOverride=1.0",
    "--/app/window/scaleToMonitor=false",
    "--/app/file/ignoreUnsavedOnExit=true",
    "--/app/testMode=1",
    "--/app/content/emptyStageOnStart=0",
    "--/persistent=0",
    "--/xr/persistence/enabled=false",
    "--reset-user",
    "--/xr/debug=true",
    "--/no-assert-dialog=true",
    "--/rtx/hydra/materialSyncLoads=true",
    "--/app/docks/disabled=true",
    "--/app/window/hideUi=true",
    "--/app/viewport/forceHideFps=true",
    "--/app/viewport/grid/enabled=false",
    "--/log/channels/omni.usd=error"
]

timeout = 3600
retries = 1

stdoutFailPatterns.exclude = [
    "*[carb.imgui.plugin] Unable to load IWindowing!*"
]

[documentation]
python_api_hidden = true
