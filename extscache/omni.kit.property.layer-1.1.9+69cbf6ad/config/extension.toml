[package]
# Semantic Versioning is used: https://semver.org/
version = "1.1.9"

category = "Internal"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Layer Property Window Widgets"
description="Property Window widgets that displays Layer related information."

# URL of the extension source repository.
repository = ""
support_level = "Core"

# Keywords for the extension
keywords = ["kit", "usd", "property", "Layer"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"
readme = "docs/Overview.md"

# Preview image displayed in extension manager
preview_image = "data/preview.png"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icon.png"

[dependencies]
"omni.kit.commands" = {}
"omni.usd" = {}
"omni.ui" = {}
"omni.client" = {}
"omni.kit.window.filepicker" = {}
"omni.kit.window.content_browser" = {}
"omni.kit.window.property" = {}
"omni.kit.widget.layers" = { optional=true}
"omni.kit.usd.layers" = {}
"omni.kit.widget.versioning" = { optional=true }

# Main python module this extension provides, it will be publicly available as "import omni.example.hello".
[[python.module]]
name = "omni.kit.property.layer"

[[test]]
args = ["--/app/file/ignoreUnsavedOnExit=true",
        "--/app/window/dpiScaleOverride=1.0",
        "--/app/window/scaleToMonitor=false",
        "--/exts/omni.ui/tooltip_delay=60",
]

dependencies = [
    "omni.kit.ui_test",
    "omni.kit.test_suite.helpers",
    "omni.kit.property.usd",
    "omni.kit.context_menu",
    "omni.kit.widget.layers",
]

[documentation]
pages = [
    "docs/CHANGELOG.md",
    "docs/Overview.md",
    "docs/USAGE_PYTHON.md",
]
